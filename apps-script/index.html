<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0E0C" media="(prefers-color-scheme: dark)">
<title>Pantry Pal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone app — sticky header, scrolling view, fixed bottom tab bar, bottom sheets for recipe detail and editing */
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --sunk:#DFE4DD; --ink:#111715; --muted:#4D5853; --line:#C6CEC4;
  --accent:#213FAC; --accent-ink:#FFFFFF; --accent-soft:#DCE2F8;
  --ok:#1A6B40; --ok-soft:#D3EBDC; --warn:#865300; --warn-soft:#F5E3BD; --bad:#A1322A; --bad-soft:#F4D6D1;
  --scrim:rgba(12,18,15,.45);
  --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --tabh:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0B0E0C; --surface:#1A211E; --sunk:#29312D; --ink:#F2F6F3; --muted:#AFBAB4; --line:#3A4540;
  --accent:#A3B6FF; --accent-ink:#0B1230; --accent-soft:#26305A;
  --ok:#72D9A0; --ok-soft:#173D28; --warn:#F0BF5E; --warn-soft:#41320F; --bad:#F68D83; --bad-soft:#47201C;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:12px}
.brand{font:700 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;margin:5px 0 0;letter-spacing:-.01em;text-wrap:balance}
.sync{appearance:none;border:0;background:none;cursor:pointer;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:4px 0 3px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on::before{background:var(--ok)}
.sync.bad::before{background:var(--bad)}

main{padding-top:16px;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;gap:16px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 12px var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;cursor:pointer}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:7px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;line-height:18px;font-variant-numeric:tabular-nums}

/* controls */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.small{min-height:34px;padding:5px 11px;font-size:13px}
.btn.wide{flex:1}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;width:100%}
textarea{resize:vertical;line-height:1.5}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;padding:4px 0}
.switch input{width:20px;height:20px;min-height:0;accent-color:var(--accent);flex:none}

.addbar{display:flex;gap:8px}
.addbar input{flex:1;min-width:0}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font:600 13px var(--f-body);white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:5px}
.stackv{display:flex;flex-direction:column;gap:18px}

/* recipe cards */
.cards{display:flex;flex-direction:column;gap:10px}
.rcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rname{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2;min-width:0;display:block}
.pill{font:700 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.pill.ready{background:var(--ok-soft);color:var(--ok)}
.pill.almost{background:var(--warn-soft);color:var(--warn)}
.pill.need{background:var(--sunk);color:var(--muted)}
.pill.draft{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.rcard.draft{background:transparent;border-style:dashed}
.draftbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px dashed var(--muted);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.draftbar p{margin:0;flex:1;min-width:180px}
.slots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.slot{font-size:12.5px;padding:3px 8px;border-radius:6px;border:1px solid transparent;line-height:1.3}
.slot.have{background:var(--ok-soft);color:var(--ok)}
.slot.short{background:var(--warn-soft);color:var(--warn)}
.slot.miss{border:1px dashed var(--muted);color:var(--muted)}
.slot.more{color:var(--muted)}
.slot.opt{border:1px dotted var(--line);color:var(--muted);font-style:italic}
.meter{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .bar{flex:1;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;display:block}
.meter .bar i{display:block;height:100%;background:var(--ok)}
.meter .bar i.part{background:var(--warn)}

/* pantry + list rows */
.group{display:flex;flex-direction:column;gap:6px}
.group h3{font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;padding-left:2px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:22px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prow{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-top:1px solid var(--line);min-height:54px}
.prow:first-child,.lrow:first-child{border-top:0}
.pname{flex:1;min-width:0;background:none;border:0;padding:6px 0;text-align:left;font-weight:500;font-size:15px;cursor:pointer}
.prow.out .pname{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center}
.qty{min-width:62px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.prow.out .qty{color:var(--bad)}
.stock{border:1px solid var(--line);background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;flex:none;min-width:62px}
.stock.off{background:var(--bad-soft);color:var(--bad)}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.lrow{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-top:1px solid var(--line);min-height:54px}
.lmain{flex:1;min-width:0;cursor:pointer;background:none;border:0;text-align:left;display:flex;align-items:center;gap:12px;padding:8px 0}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:transparent}
.lrow.done .check{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ltext{min-width:0;display:flex;flex-direction:column}
.lname{font-weight:500}
.lqty{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.lfor{font-size:12px;color:var(--muted)}
.lrow.done .lname{text-decoration:line-through;color:var(--muted)}
.x{width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px;flex:none}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap}

.empty{text-align:center;padding:30px 18px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-size:14px}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note p{margin:0;flex:1;min-width:200px}
.sheetlink{text-align:center;font-size:13px;color:var(--muted)}
.connect{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.connect h2{font-family:var(--f-display);margin:0;font-size:20px;line-height:1.2}
.connect p{margin:0;color:var(--muted);max-width:60ch}
.connect code{font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.err{color:var(--bad)!important}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:600px;max-height:calc(100% - 32px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out;box-shadow:var(--shadow)}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:18px;max-height:86%;padding-bottom:20px}}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--surface);padding:16px 0 10px;z-index:1}
.sheet-h h2{font-family:var(--f-display);font-size:23px;line-height:1.15;margin:0;text-wrap:balance}
.sheet-h .sub{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;cursor:pointer;flex:none}
.sheet form,.sheet .stack{display:flex;flex-direction:column;gap:14px}
.serv{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;font-size:14px}
.serv .stepper span{min-width:40px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ilist{display:flex;flex-direction:column}
.irow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.dot{width:14px;height:14px;border-radius:50%;justify-self:center;display:block}
.dot.have{background:var(--ok)}
.dot.short{background:linear-gradient(90deg,var(--warn) 50%,transparent 50%);border:2px solid var(--warn)}
.dot.miss{border:2px dashed var(--muted)}
.dot.opt{border:2px dotted var(--line)}
.iname{font-weight:500;display:block}
.inote{color:var(--muted);font-weight:400}
.isub{font-size:12.5px;color:var(--muted);display:block}
.iright{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.ineed{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;white-space:nowrap}
.onlist{font-size:12px;color:var(--muted);white-space:nowrap;padding-inline:4px}
.sec-label{font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 2px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.preview{display:flex;flex-direction:column;gap:2px;font-size:13px;background:var(--bg);border-radius:10px;padding:8px 12px}
.preview .pr{display:grid;grid-template-columns:14px 72px minmax(0,1fr);gap:8px;align-items:center;padding:3px 0}
.preview .pr .dot{width:10px;height:10px}
.preview .pq{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);z-index:30;background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 32px);font-size:14px;box-shadow:var(--shadow)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px 6px}
.toast span{min-width:0}
.textout{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:220px}

/* recipe icons */
.rtitle{display:flex;align-items:center;gap:10px;min-width:0}
.ricon{font-size:24px;line-height:1;flex:none;width:36px;height:36px;display:grid;place-items:center;background:var(--sunk);border-radius:10px}
.rcard.draft .ricon{opacity:.6}
.iconbtn{font-size:26px;line-height:1;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;margin-right:10px;vertical-align:middle;display:inline-grid;place-items:center}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.iconopt{font-size:26px;line-height:1;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.iconopt[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}

/* barcode scanner */
.btn.icon{padding:0;width:42px;flex:none}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;left:10%;right:10%;top:28%;bottom:28%;border:2px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.torch{position:absolute;right:10px;bottom:10px}
.scanstatus{margin:0;color:var(--muted);font-size:14px;text-align:center}
.scanhint{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;font-size:inherit}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="wrap">
      <div><div class="brand">Pantry Pal</div><h1 id="title">What can I make?</h1></div>
      <button id="sync" class="sync" data-act="refreshNow" title="Sync with your sheet">Connecting…</button>
    </div>
  </header>
  <main id="view" class="wrap"></main>
  <nav class="tabs" aria-label="Sections">
    <div class="wrap" role="tablist">
      <button class="tab" role="tab" data-tab="recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16v4.5A5.5 5.5 0 0 1 14.5 20h-5A5.5 5.5 0 0 1 4 14.5z"/><path d="M2 10h20"/><path d="M9 7c0-1.2 1-1.2 1-2.4M14 7c0-1.2 1-1.2 1-2.4"/></svg>Recipes</button>
      <button class="tab" role="tab" data-tab="pantry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16"/><path d="M8 6.2h2.5M8 12.2h4M8 18.2h2.5"/></svg>Pantry</button>
      <button class="tab" role="tab" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.3 1.3L7.2 5M3.5 12l1.3 1.3L7.2 11M3.5 18l1.3 1.3L7.2 17"/></svg>Grocery list<span id="listBadge" class="badge" hidden></span></button>
    </div>
  </nav>
</div>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="scrim" data-act="close"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div id="sheetBody"></div></section>
</div>
<div id="toast" class="toast" role="status" hidden><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
(function(){
"use strict";

/* =====================================================================
   CONFIG — only needed when hosting outside Apps Script (GitHub Pages).
   Paste your Apps Script web app URL (it ends in /exec).
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbwSpWrbiB1ak7Sj3dDuZNlAcvEueD1DKPu_KC8E-JcW-EPetTz104e2ZroLZBapTO5p/exec";

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap=s=>{s=String(s||"").trim();return s.charAt(0).toUpperCase()+s.slice(1);};
const round2=n=>Math.round(n*100)/100;

/* ---------- units ---------- */
const UNITS=["pcs","g","kg","ml","l","tsp","tbsp","cup","lb","oz","clove","can","bunch","pack","slice"];
// Canadian metric cup (250 ml), tbsp 15 ml, tsp 5 ml
const CONV={g:["m",1],kg:["m",1000],lb:["m",453.6],oz:["m",28.35],ml:["v",1],l:["v",1000],tsp:["v",5],tbsp:["v",15],cup:["v",250]};
const COUNTISH=new Set(["pcs","clove","can","bunch","pack","slice",""]);

/* ---------- parsing ---------- */
const UF={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125};
function parseLine(line){
  let s=String(line||"").trim().replace(/^[-*•▢□]\s*/,"");if(!s)return null;

  else if((m=s.match(/^(\d+)\s+(\d+)\/(\d+)/))){qty=+m[1]+(+m[2])/(+m[3]);}
  else if((m=s.match(/^(\d+)\/(\d+)/))){qty=(+m[1])/(+m[2]);}
  else if((m=s.match(/^(\d*[.,]?\d+)/))){qty=parseFloat(m[1].replace(",","."));}
  else if((m=s.match(/^([½¼¾⅓⅔⅛])/))){qty=UF[m[1]];}
  if(m)s=s.slice(m[0].length).trim();
  let unit="";
  if(qty!=null){const um=s.match(/^([a-zA-Z]+)\.?(?=\s|$)/);if(um&&ALIAS[um[1].toLowerCase()]){unit=ALIAS[um[1].toLowerCase()];s=s.slice(um[0].length).trim();}if(!unit)unit="pcs";}

  s=s.replace(/\s+(to taste|as needed|optional|for serving)\s*$/i,(x,y)=>{note=[y,note].filter(Boolean).join(", ");return"";});

}

const pendQ={},pendT={};
function effQty(it){return pendQ[it.id]!==undefined?pendQ[it.id]:(+it.qty||0);}
function isOut(it){return it.staple?it.inStock===false:effQty(it)<=0;}
function findItem(name){const n=norm(name);if(!n)return null;let best=null,bl=0;for(const it of S.items){const m=norm(it.name);if(!m)continue;if(m===n)return it;if((n.endsWith(" "+m)||m.endsWith(" "+n))&&m.length>bl){best=it;bl=m.length;}}return best;}
function findExact(name){const n=norm(name);return S.items.find(it=>norm(it.name)===n)||null;}
const isOptional=ing=>/\boptional\b/i.test(ing.note||"")||/\(optional\)/i.test(ing.name||"");
// Optional ingredients you don't have are marked "opt" and never block a recipe
function check(ing,scale){const r=checkRaw(ing,scale);if(r.s!=="have"&&isOptional(ing)){r.raw=r.s;r.s="opt";}return r;}
function checkRaw(ing,scale){
  const it=findItem(ing.name);const need=ing.qty==null?null:ing.qty*scale;const u=ing.unit||"";
  if(!it)return{s:"miss",item:null,need,short:need,unit:u};
  if(it.staple)return it.inStock!==false?{s:"have",item:it,staple:true}:{s:"miss",item:it,need,short:need,unit:u};
  const hq=effQty(it);
  if(hq<=0)return{s:"miss",item:it,need,short:need,unit:u};
  if(need==null)return{s:"have",item:it};
  const c=convert(hq,it.unit,u);
  if(c==null)return{s:"have",item:it,approx:true};
  if(c+1e-9>=need)return{s:"have",item:it};
  return{s:"short",item:it,need,have:c,short:need-c,unit:u};
}
function stats(r,scale){
  const rows=(r.ingredients||[]).map(i=>Object.assign({ing:i},check(i,scale||1)));
  const have=rows.filter(x=>x.s==="have").length;const opt=rows.filter(x=>x.s==="opt").length;
  const total=rows.length-opt;const miss=total-have;
  const status=!rows.length?"empty":miss===0?"ready":miss<=2?"almost":"need";
  return{rows,have,total,opt,miss,status};
}

  [/peach/,"🍑"],[/strawberr/,"🍓"],[/blueberr/,"🫐"],[/banana/,"🍌"],[/apple/,"🍎"],[/lemon/,"🍋"],
  [/milk|latte/,"🥛"],[/coffee/,"☕"],[/\btea\b|matcha/,"🍵"],[/smoothie|shake|juice/,"🥤"],
  [/\bjam\b|preserve|marmalade|honey/,"🍯"],
];
// When the name says nothing useful, use the first main ingredient
const ING_ICONS=[
  [/chicken/,"🍗"],[/beef|steak|chuck/,"🥩"],[/pork|bacon/,"🍖"],[/salmon|tilapia|fish|cod|tuna/,"🐟"],[/shrimp|prawn/,"🍤"],
  [/pasta|spaghetti|noodle|linguin|ramen|udon/,"🍝"],[/\brice\b/,"🍚"],[/\begg/,"🍳"],[/potato/,"🥔"],[/tofu/,"🥢"],
  [/lettuce|spinach|cabbage|kale/,"🥗"],[/flour/,"🍞"],[/chocolate|cocoa/,"🍫"],
];
const ICON_CHOICES=["🍗","🥩","🍖","🥓","🍤","🐟","🍣","🍙","🍱","🍚","🍛","🍜","🍝","🥟","🍲","🥣","🥗","🥙","🌮","🌯","🍕","🍔","🌭","🥪","🍟","🥔","🍳","🥞","🧇","🍞","🥐","🥯","🥑","🥦","🥬","🍆","🍄","🥢","🧆","🫕","🍰","🧁","🍪","🥧","🍮","🍫","🍨","🍩","🍯","🍑","🍓","🫐","🍌","🥭","🍎","🍋","🥛","☕","🍵","🥤","🍽️"];
const DEFAULT_ICON="🍽️";
const plainText=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function autoIcon(r){
  const n=plainText(r.name);
  for(const[re,e]of ICON_RULES)if(re.test(n))return e;
  const ings=(r.ingredients||[]).filter(i=>!/\boptional\b/i.test(i.note||"")).slice(0,4).map(i=>plainText(i.name));
  for(const ing of ings)for(const[re,e]of ING_ICONS)if(re.test(ing))return e;
  return DEFAULT_ICON;
}
const recipeIcon=r=>(r.icon&&String(r.icon).trim())||autoIcon(r);
let iconServer=true; // false when the sheet's Code.gs predates the Icon column
function sheetIconPick(){
  const r=S.recipes.find(x=>x.id===sheet.id);if(!r){setTimeout(closeSheet,0);return"";}
  const cur=(r.icon||"").trim(),auto=autoIcon(r);
  return head("Choose an icon",`<span>${esc(r.name)}</span>`)+`<div class="stack">
    <button class="btn ${cur?"":"primary"}" data-act="setIcon" data-icon="">${auto} Automatic${cur?"":" (current)"}</button>
    <div class="icongrid">${ICON_CHOICES.map(e=>`<button class="iconopt" data-act="setIcon" data-icon="${e}" aria-pressed="${cur===e}" aria-label="Use ${e}">${e}</button>`).join("")}</div>
    ${iconServer?"":`<p class="scanhint" style="margin:0">To keep your choice, update Code.gs in Apps Script. Until then it resets on the next sync.</p>`}
  </div>`;
}

/* ---------- recipes view ---------- */
function renderRecipes(){
  const el=$("#rList");if(!el)return;
  if(!ready){el.innerHTML=loadingHTML;$("#rFilters").innerHTML="";return;}
  // Drafts (ticked as Draft, or no ingredients yet) live in their own filter and never count as cookable
  const byName=(a,b)=>String(a.r.name).localeCompare(b.r.name);
  const rows=S.recipes.map(r=>({r,st:stats(r,1),d:isDraft(r)}));
  const live=rows.filter(x=>!x.d).sort((a,b)=>a.st.miss-b.st.miss||byName(a,b));
  const drafts=rows.filter(x=>x.d).sort(byName);
  const cnt={all:live.length,ready:0,almost:0,need:0,drafts:drafts.length};live.forEach(x=>cnt[x.st.status]++);
  const F=[["all","All"],["ready","Ready"],["almost","1–2 away"],["need","Need more"],["drafts","Drafts"]].filter(([k])=>k!=="drafts"||cnt.drafts);
  if(rFilter==="drafts"&&!cnt.drafts)rFilter="all";
  $("#rFilters").innerHTML=F.map(([k,l])=>`<button class="chip" data-act="rFilter" data-k="${k}" aria-pressed="${rFilter===k}">${l}<span class="n">${cnt[k]}</span></button>`).join("");
  const shown=rFilter==="drafts"?drafts:rFilter==="all"?live:live.filter(x=>x.st.status===rFilter);
  if(!rows.length){el.innerHTML=`<div class="empty"><strong>No recipes yet</strong>Tap <b>+ New</b> and paste the ingredient list, or add rows to the Recipes tab in your sheet.</div>`;return;}
  if(!shown.length){el.innerHTML=rFilter==="all"?`<div class="empty"><strong>No finished recipes yet</strong>Your recipes are all drafts. Open one under <b>Drafts</b> and add its ingredients.</div>`:`<div class="empty"><strong>${rFilter==="ready"?"Nothing ready to cook":"No recipes here"}</strong>${rFilter==="ready"?"Check 1–2 away for recipes that only need a quick shop.":"Try another filter."}</div>`;return;}
  el.innerHTML=shown.map(({r,st,d})=>{
    const name=`<span class="rtitle"><span class="ricon" aria-hidden="true">${recipeIcon(r)}</span><span class="rname">${esc(r.name)}${r.example?'<span class="tag">Example</span>':""}</span></span>`;
    if(d)return`<button class="rcard draft" data-act="openRecipe" data-id="${esc(r.id)}"><span class="rhead">${name}<span class="pill draft">Draft</span></span><span class="meter">${st.rows.length?`${st.rows.length} ingredient${st.rows.length>1?"s":""} so far`:"No ingredients yet"}</span></button>`;
    const pill=st.status==="ready"?`<span class="pill ready">Ready</span>`:`<span class="pill ${st.status}">Need ${st.miss}</span>`;
    const slots=st.rows.slice(0,8).map(x=>`<span class="slot ${x.s}">${esc(x.ing.name)}</span>`).join("")+(st.rows.length>8?`<span class="slot more">+${st.rows.length-8} more</span>`:"");
    const pct=st.total?Math.round(st.have/st.total*100):100;
    return`<button class="rcard" data-act="openRecipe" data-id="${esc(r.id)}"><span class="rhead">${name}${pill}</span><span class="slots">${slots}</span><span class="meter"><span class="bar"><i class="${st.status==="ready"?"":"part"}" style="width:${pct}%"></i></span>${st.have} of ${st.total} ingredients${st.opt?` · ${st.opt} optional`:""}</span></button>`;
  }).join("");
}

/* ---------- pantry view ---------- */
function renderPantry(){
  const el=$("#pList");if(!el)return;
  if(!ready){el.innerHTML=loadingHTML;return;}
  if(!S.items.length){el.innerHTML=`<div class="empty"><strong>Your pantry is empty</strong>Type what you have above, like "1 kg rice" or "6 eggs". Items you check off on the grocery list land here too.</div>`;return;}
  const pf=parseLine(pFilter);const f=norm(pf?pf.name:"");
  const items=S.items.filter(it=>!f||norm(it.name).includes(f));
  if(!items.length){el.innerHTML=`<div class="empty"><strong>Not in your pantry</strong>Tap <b>Add</b> to add "${esc(pFilter.trim())}".</div>`;return;}
  const groups={};items.forEach(it=>{const c=CATS.includes(it.category)?it.category:guessCat(it.name);(groups[c]=groups[c]||[]).push(it);});
  el.innerHTML=CATS.filter(c=>groups[c]).map(c=>{
    const rows=groups[c].sort((a,b)=>isOut(a)-isOut(b)||String(a.name).localeCompare(b.name)).map(it=>{

/* ---------- list view ---------- */

  let h=CATS.filter(c=>groups[c]).map(c=>`<section class="group"><h3>${esc(c)}<span>${groups[c].length}</span></h3><div class="rows">${groups[c].sort((a,b)=>String(a.name).localeCompare(b.name)).map(row).join("")}</div></section>`).join("");

/* ---------- bottom sheet ---------- */
function openSheet(s){stopScan();sheet=s;$("#sheetWrap").hidden=false;document.body.style.overflow="hidden";renderSheet(true);}
function closeSheet(){stopScan();sheet=null;$("#sheetWrap").hidden=true;$("#sheetBody").innerHTML="";document.body.style.overflow="";}
function head(title,sub){return`<div class="sheet-h"><div style="min-width:0"><h2 id="sheetTitle">${title}</h2>${sub?`<div class="sub">${sub}</div>`:""}</div><button class="close" data-act="close" aria-label="Close">×</button></div>`;}
function renderSheet(first){
  if(!sheet)return;const b=$("#sheetBody");
  if(sheet.type==="recipe")b.innerHTML=sheetRecipe();
  else if(sheet.type==="editRecipe"){b.innerHTML=sheetEditRecipe();bindRecipeForm();}

  else if(sheet.type==="iconPick")b.innerHTML=sheetIconPick();

function sheetRecipe(){
  const r=S.recipes.find(x=>x.id===sheet.id);
  if(!r){setTimeout(closeSheet,0);return"";}
  const base=Math.max(1,+r.servings||1);const serv=sheet.servings||base;const scale=serv/base;
  const st=stats(r,scale);const miss=st.rows.filter(needsBuying);
  const draft=isDraft(r),noIng=!st.rows.length;
  const draftBar=draft?`<div class="draftbar"><p>${noIng?"Draft. Add ingredients to finish this recipe. Until then it stays out of your cooking list.":"Draft. This recipe is hidden from your cooking list."}</p>${noIng?`<button class="btn small primary" data-act="editRecipe">Add ingredients</button>`:`<button class="btn small primary" data-act="setDraft" data-v="0">Mark finished</button>`}</div>`:"";
  const pill=draft?`<span class="pill draft">Draft</span>`:st.status==="ready"?`<span class="pill ready">Ready to cook</span>`:`<span class="pill ${st.status}">Need ${st.miss}</span>`;
  const rows=st.rows.map((x,i)=>{
    const ing=x.ing;const need=ing.qty!=null?qtyText(ing.qty*scale,ing.unit):"";
    const s=x.s==="opt"?x.raw:x.s;let sub;
    if(s==="have")sub=x.staple?"Staple · in stock":x.approx?`Have ${qtyText(effQty(x.item),x.item.unit)} · different unit`:ing.qty==null?"In pantry":`Have ${qtyText(effQty(x.item),x.item.unit)}`;
    else if(s==="short")sub=`Have ${qtyText(x.have,x.unit)} · short ${qtyText(roundShort(x.short,x.unit),x.unit)}`;
    else sub=x.item?(x.item.staple?"Staple · out":"Out of stock"):"Not in pantry";
    if(x.s==="opt")sub="Optional · "+sub.charAt(0).toLowerCase()+sub.slice(1);
    const btn=x.s==="have"?"":(listEntry(ing.name)?`<span class="onlist">On list</span>`:`<button class="btn ghost small" data-act="addOne" data-i="${i}">+ List</button>`);
    const lbl={have:"Have",short:"Not enough",miss:"Missing",opt:"Optional"}[x.s];
    return`<div class="irow"><span class="dot ${x.s}" aria-label="${lbl}"></span><span style="min-width:0"><span class="iname">${esc(ing.name)}${ing.note?`<span class="inote">, ${esc(ing.note)}</span>`:""}</span><span class="isub">${esc(sub)}</span></span><span class="iright"><span class="ineed">${esc(need)}</span>${btn}</span></div>`;
  }).join("");
  const toAdd=miss.filter(x=>!listEntry(x.ing.name)).length;
  const addBtn=miss.length?`<button class="btn ${st.status==="ready"?"":"primary"} wide" data-act="addMissing" ${toAdd?"":"disabled"}>${toAdd?`Add ${toAdd} missing to list`:"Missing items are on your list"}</button>`:"";
  const cookBtn=st.status==="empty"?"":`<button class="btn ${st.status==="ready"?"primary":""} wide" data-act="cook">${st.status==="ready"?"Cook it":"Cook anyway"}</button>`;
  const steps=String(r.steps||"").split(/\n+/).map(s=>s.replace(/^\s*(\d+[.)]|step \d+:?|[-*•])\s*/i,"").trim()).filter(Boolean);
  const meta=[r.link&&/^https?:\/\//i.test(r.link)?`<a href="${esc(r.link)}" target="_blank" rel="noopener">Original recipe ↗</a>`:"",r.lastCooked?`Last cooked ${esc(new Date(r.lastCooked).toLocaleDateString(undefined,{month:"short",day:"numeric"}))}`:""].filter(Boolean).join(" · ");
  return head(`<button class="iconbtn" data-act="pickIcon" aria-label="Change icon" title="Change icon">${recipeIcon(r)}</button>`+esc(r.name)+(r.example?'<span class="tag">Example</span>':""),pill+(noIng?"":`<span>${st.have} of ${st.total} ingredients${st.opt?` · ${st.opt} optional`:""}</span>`))+
  `<div class="stack">
    ${draftBar}
    <div class="serv"><span>Servings${scale!==1?` <span style="color:var(--muted)">(recipe makes ${base})</span>`:""}</span><div class="stepper"><button data-act="serv" data-d="-1" aria-label="Fewer servings">−</button><span>${serv}</span><button data-act="serv" data-d="1" aria-label="More servings">+</button></div></div>
    <div class="ilist">${rows||'<p style="color:var(--muted);margin:0">No ingredients yet. Edit the recipe to add them.</p>'}</div>
    <div class="actions">${addBtn}${cookBtn}</div>
    <p style="margin:0;font-size:12.5px;color:var(--muted)">Cooking takes the amounts above out of your pantry. Staples stay in stock.</p>
    ${steps.length?`<div class="sec-label">Steps</div><ol class="steps">${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:""}
    ${meta?`<div style="font-size:13px;color:var(--muted)">${meta}</div>`:""}
    <div class="foot"><div class="actions"><button class="btn" data-act="editRecipe">Edit recipe</button>${draft?"":`<button class="btn" data-act="setDraft" data-v="1">Move to drafts</button>`}</div><button class="btn danger" data-act="delRecipe" data-confirm="Tap again to delete">Delete</button></div>
  </div>`;
}

/* ---------- actions ---------- */
// Adds to an existing pantry item when the name matches, otherwise creates one.
// packs: when scanning, lets "3 packages" land on an item you count in pcs/packs/cans.
async function addToPantry(name,qty,unit,category,packs){
  const ex=findExact(name);
  if(ex){
    if(ex.staple){await store.update("items",ex.id,{inStock:true});return{msg:`${ex.name} marked in stock`};}
    if(qty==null)return{edit:ex.id};
    let c=convert(qty,unit,ex.unit);
    if(c==null&&packs&&["pcs","pack","can"].includes(ex.unit))c=packs;
    const set=async nq=>{delete pendQ[ex.id];clearTimeout(pendT[ex.id]);await store.update("items",ex.id,{qty:nq});};
    if(c!=null){const nq=round2(effQty(ex)+c);await set(nq);return{msg:`${ex.name}: now ${qtyText(nq,ex.unit)}`};}
    if(effQty(ex)<=0){delete pendQ[ex.id];clearTimeout(pendT[ex.id]);await store.update("items",ex.id,{qty,unit});return{msg:`${ex.name}: now ${qtyText(qty,unit)}`};}
    return{err:`${ex.name} is counted in ${ex.unit==="l"?"L":ex.unit}. Edit it to change units.`};
  }
  const data={name:cap(name),qty:qty!=null?qty:1,unit:qty!=null?(unit||"pcs"):"pcs",category:category||guessCat(name),staple:false,inStock:true};
  await store.add("items",data);return{msg:`Added ${data.name} to ${data.category}`};
}
async function addToList(name,qty,unit,forRecipe){
  unit=unit||"";const ex=listEntry(name);
  if(ex){
    const f=(ex.for||[]).slice();if(forRecipe&&f.includes(forRecipe))return false;if(forRecipe)f.push(forRecipe);
    let nq=ex.qty,nu=ex.unit;
    if(qty!=null){
      if(ex.qty==null){nq=qty;nu=unit;}
      else{const c=convert(qty,unit,ex.unit);if(c==null){await store.add("list",{name:cap(name),qty,unit,checked:false,for:forRecipe?[forRecipe]:[],created:Date.now()});return true;}nq=round2(ex.qty+c);}
    }
    await store.update("list",ex.id,{qty:nq,unit:nu,for:f});return true;
  }
  await store.add("list",{name:cap(name),qty:qty==null?null:round2(qty),unit,checked:false,for:forRecipe?[forRecipe]:[],created:Date.now()});return true;
}
async function addMissing(r,scale,only){
  const st=stats(r,scale);let n=0;
  for(const[i,x]of st.rows.entries()){
    if(x.s==="have")continue;if(only!=null&&i!==only)continue;if(only==null&&(x.s==="opt"||listEntry(x.ing.name)))continue;
    const q=x.s==="short"?roundShort(x.short,x.unit):x.need!=null?roundShort(x.need,x.unit):null;
    if(await addToList(x.ing.name,q,x.unit,r.name))n++;
  }
  return n;
}
async function cook(r,scale){
  const use=new Map();
  for(const ing of r.ingredients||[]){const it=findItem(ing.name);if(!it||it.staple||ing.qty==null)continue;const c=convert(ing.qty*scale,ing.unit,it.unit);if(c==null)continue;use.set(it.id,(use.get(it.id)||0)+c);}
  const undo=[];
  for(const[id,amt]of use){const it=S.items.find(x=>x.id===id);if(!it)continue;const prev=effQty(it);delete pendQ[id];clearTimeout(pendT[id]);const next=Math.max(0,round2(prev-amt));if(next===prev)continue;undo.push({id,qty:prev});await store.update("items",id,{qty:next});}
  await store.update("recipes",r.id,{lastCooked:Date.now()});
  toast(`Cooked ${r.name}. ${undo.length?`Used ${undo.length} pantry item${undo.length>1?"s":""}.`:"Pantry unchanged."}`,undo.length?{label:"Undo",fn:async()=>{for(const u of undo)await store.update("items",u.id,{qty:u.qty});toast("Pantry restored");}}:null);
}
async function putAway(){
  const done=S.list.filter(l=>l.checked);const acc=new Map();const made=new Map();let created=0,guessed=0;
  for(const l of done){
    const it=findItem(l.name);
    if(it){
      if(it.staple){await store.update("items",it.id,{inStock:true});continue;}
      const cur=acc.has(it.id)?acc.get(it.id):{qty:effQty(it),unit:it.unit||"pcs"};
      if(l.qty==null){if(cur.qty<=0){cur.qty=cur.unit==="g"?500:cur.unit==="ml"?1000:1;guessed++;}}
      else{const c=convert(l.qty,l.unit,cur.unit);if(c!=null)cur.qty=round2(cur.qty+c);else if(cur.qty<=0){cur.qty=l.qty;cur.unit=l.unit||"pcs";}else guessed++;}
      acc.set(it.id,cur);
    }else{
      const n=norm(l.name);if(made.has(n))continue;made.set(n,1);
      await store.add("items",{name:cap(l.name),qty:l.qty!=null?l.qty:1,unit:l.qty!=null?(l.unit||"pcs"):"pcs",category:guessCat(l.name),staple:false,inStock:true});created++;if(l.qty==null)guessed++;
    }
  }
  for(const[id,v]of acc){delete pendQ[id];clearTimeout(pendT[id]);await store.update("items",id,{qty:v.qty,unit:v.unit});}
  for(const l of done)await store.del("list",l.id);
  toast(`Put away ${done.length} item${done.length>1?"s":""}${created?`, ${created} new to the pantry`:""}.${guessed?" Check amounts in Pantry.":""}`);
}
function stepItem(id,dir){
  const it=S.items.find(x=>x.id===id);if(!it)return;const st=STEP[it.unit]||1;
  const q=Math.max(0,round2(effQty(it)+dir*st));pendQ[id]=q;refresh();
  clearTimeout(pendT[id]);pendT[id]=setTimeout(()=>{const v=pendQ[id];delete pendQ[id];store.update("items",id,{qty:v});},600);
}
async function clearExamples(){
  let n=0;for(const c of COLLS)for(const d of S[c].filter(x=>x.example)){await store.del(c,d.id);n++;}
  toast(`Removed ${n} example${n===1?"":"s"}`);
}
function listText(){
  const open=S.list.filter(l=>!l.checked);const g={};open.forEach(l=>{const it=findItem(l.name);const c=it&&CATS.includes(it.category)?it.category:guessCat(l.name);(g[c]=g[c]||[]).push(l);});
  return CATS.filter(c=>g[c]).map(c=>c+"\n"+g[c].map(l=>"- "+l.name+(l.qty!=null?" ("+qtyText(l.qty,l.unit)+")":"")).join("\n")).join("\n\n");
}

/* ---------- barcode scanning ----------
   1. Camera + barcode reader (Chrome's built-in one on Android; a fallback reader loads on other phones)
   2. Lookup: your saved barcodes first, then Open Food Facts (free product database)
   3. Confirm the name and size, add to pantry or list, and remember the barcode for next time */
const SCAN_BTN=dest=>`<button class="btn icon" type="button" data-act="scan" data-dest="${dest}" aria-label="Scan a barcode" title="Scan a barcode"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/></svg></button>`;
let scanStream=null,scanTimer=null,scanLast="",scanHits=0,scanDest="pantry",detectorP=null,torchOn=false;
const normCode=c=>String(c||"").replace(/\D/g,"").replace(/^0+/,"");
const canCamera=()=>!isGAS&&window.isSecureContext&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
function getDetector(){
  if(detectorP)return detectorP;
  const formats=["ean_13","ean_8","upc_a","upc_e"];
  detectorP=(async()=>{
    if("BarcodeDetector" in window){try{const sup=await BarcodeDetector.getSupportedFormats();const f=formats.filter(x=>sup.includes(x));if(f.length)return new BarcodeDetector({formats:f});}catch(e){}}
    const m=await import("https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/es/ponyfill.js");
    return new m.BarcodeDetector({formats});
  })();
  detectorP.catch(()=>{detectorP=null;});
  return detectorP;
}
function sheetScan(){
  const cam=canCamera();
  return head("Scan a barcode",`<span>${scanDest==="list"?"Adds to your grocery list":"Adds to your pantry"}</span>`)+`<div class="stack">
    ${cam?`<div class="scanbox"><video id="scanVideo" playsinline muted></video><div class="scanframe" aria-hidden="true"></div><button class="btn small torch" type="button" data-act="torch" id="torchBtn" hidden>Light</button></div><p id="scanStatus" class="scanstatus" aria-live="polite">Starting camera…</p>`
      :`<p class="scanstatus">${isGAS?"The camera only works in the installed app (your GitHub Pages link). You can still type the barcode number below.":"This browser can't open the camera. Type the barcode number below."}</p>`}
    <form id="codeForm" class="addbar" autocomplete="off"><input id="codeInput" inputmode="numeric" placeholder="Or type the barcode number" aria-label="Barcode number"><button class="btn" type="submit">Look up</button></form>
  </div>`;
}
async function startScan(){
  if(!canCamera())return;
  const v=$("#scanVideo"),setS=t=>{const st=$("#scanStatus");if(st)st.textContent=t;};
  scanLast="";scanHits=0;torchOn=false;
  try{
    const det=getDetector();
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!sheet||sheet.type!=="scan"||!v||!v.isConnected){stream.getTracks().forEach(t=>t.stop());return;}
    scanStream=stream;v.srcObject=stream;await v.play();
    try{const caps=stream.getVideoTracks()[0].getCapabilities();if(caps&&caps.torch)$("#torchBtn").hidden=false;}catch(e){}
    setS("Loading the barcode reader…");
    const detector=await det;
    if(!scanStream)return;
    setS("Hold the barcode inside the box");
    const tick=async()=>{
      if(!scanStream)return;
      try{
        if(v.readyState>=2){
          const codes=await detector.detect(v);const c=codes&&codes[0]&&codes[0].rawValue;
          // Accept a code only after reading it twice in a row, to avoid misreads
          if(c){if(c===scanLast)scanHits++;else{scanLast=c;scanHits=1;}if(scanHits>=2){onScanned(c);return;}}
        }
      }catch(e){}
      if(scanStream)scanTimer=setTimeout(tick,120);
    };
    tick();
  }catch(e){
    stopScan();
    const n=e&&e.name;
    setS(n==="NotAllowedError"||n==="SecurityError"?"Camera access is blocked. Allow the camera for this site in Chrome's site settings, or type the number below."
      :n==="NotFoundError"?"No camera found. Type the number below.":"Couldn't start the scanner. Type the number below.");
  }
}
function stopScan(){clearTimeout(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}}
async function onScanned(code){
  stopScan();try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  const s={type:"scanResult",code:String(code).replace(/\D/g,""),loading:true,pk:1};openSheet(s);
  const r=await lookupBarcode(s.code);
  if(sheet!==s)return;s.loading=false;s.result=r;renderSheet(true);
}
// "900 g", "1.5 L", "6 x 355 ml", "75 cl" → {qty, unit}
function parseQty(s){
  s=String(s||"").toLowerCase().replace(/(\d),(\d)/g,"$1.$2");
  let n=1,m=s.match(/(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(kg|g|mg|ml|cl|l|oz|lb)\b/);
  if(m){n=+m[1];m=[m[0],m[2],m[3]];}else m=s.match(/(\d+(?:\.\d+)?)\s*(kg|g|mg|ml|cl|l|oz|lb)\b/);
  if(!m)return null;let q=+m[1]*n,u=m[2];
  if(u==="cl"){q*=10;u="ml";}if(u==="mg"){q/=1000;u="g";}
  return q>0?{qty:round2(q),unit:u}:null;
}
const cleanName=s=>cap(String(s||"").replace(/\s*[-–,(]?\s*\d+(?:[.,]\d+)?\s*(kg|g|mg|ml|cl|l|oz|lb)\b.*$/i,"").replace(/\s+/g," ").trim());
async function fetchOFF(code){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json?fields=product_name,product_name_en,generic_name,brands,quantity",{signal:ctl.signal});
    if(r.status===404)return null;
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();return j&&j.status===1&&j.product?j.product:null;
  }finally{clearTimeout(to);}
}
async function lookupBarcode(code){
  const k=normCode(code);
  const saved=S.barcodes.find(b=>normCode(b.code)===k);
  if(saved)return{source:"saved",code,name:saved.name,qty:saved.qty,unit:saved.unit,category:saved.category,brand:saved.brand,savedId:saved.id};
  try{
    let p=await fetchOFF(code);
    if(!p&&code.length===12)p=await fetchOFF("0"+code); // UPC-A is also stored as 13-digit EAN
    if(!p)return{source:"none",code};
    const name=cleanName(p.product_name_en||p.product_name||p.generic_name||"");const q=parseQty(p.quantity);
    return{source:"off",code,name,qty:q?q.qty:null,unit:q?q.unit:"pcs",category:guessCat(name),brand:String(p.brands||"").split(",")[0].trim()};
  }catch(e){return{source:"offline",code};}
}
function sheetScanResult(){
  if(sheet.loading)return head("Looking it up…")+`<div class="stack"><p class="scanstatus">Barcode ${esc(sheet.code)}</p></div>`;
  const r=sheet.result,dest=scanDest;
  const src={saved:"From your saved barcodes.",off:"Found in Open Food Facts. Check the name and size.",none:"Not in the product database yet. Name it once and it's remembered.",offline:"Couldn't reach the product database. Name it and it's remembered."}[r.source];
  return head(r.name?esc(r.name):"New product",`<span>${esc(src)}</span>`)+`<form id="scanForm" class="stack" autocomplete="off">
    <label class="field">Name in your pantry<input id="sName" required value="${esc(r.name||"")}" list="pantryNames" placeholder="e.g. Spaghetti"></label>
    <datalist id="pantryNames">${S.items.map(i=>`<option value="${esc(i.name)}"></option>`).join("")}</datalist>
    <div id="sMatch" class="scanhint" aria-live="polite"></div>
    <div class="row2"><label class="field">Size per package<input id="sQty" type="number" step="any" min="0" inputmode="decimal" value="${r.qty!=null?esc(r.qty):""}" placeholder="1"></label><label class="field">Unit<select id="sUnit">${UNITS.map(u=>`<option value="${u}" ${(r.unit||"pcs")===u?"selected":""}>${u==="l"?"L":u}</option>`).join("")}</select></label></div>
    <div class="serv"><span>Packages</span><div class="stepper"><button type="button" data-act="pk" data-d="-1" aria-label="Fewer packages">−</button><span id="sPk">${sheet.pk}</span><button type="button" data-act="pk" data-d="1" aria-label="More packages">+</button></div></div>
    <label class="field">Section<select id="sCat">${CATS.map(c=>`<option ${c===(r.category||guessCat(r.name))?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
    <p class="scanhint" style="margin:0">${r.brand?esc(r.brand)+" · ":""}Barcode ${esc(r.code)}</p>
    ${barcodeServer?`<label class="switch"><input type="checkbox" id="sRemember" checked> Remember this barcode</label>`:`<p class="scanhint" style="margin:0">To remember barcodes, update Code.gs in Apps Script.</p>`}
    <div class="actions"><button class="btn ${dest==="pantry"?"primary":""} wide" type="submit" data-to="pantry">Add to pantry</button><button class="btn ${dest==="list"?"primary":""} wide" type="submit" data-to="list">Add to list</button></div>
    <button class="btn ghost" type="button" data-act="scan" data-dest="${dest}">Scan a different item</button>
  </form>`;
}
function updateScanMatch(){
  const el=$("#sMatch");if(!el)return;const n=$("#sName").value.trim();
  if(!n){el.textContent="";return;}
  const ex=findExact(n);
  if(ex){el.innerHTML=`Adds to your pantry item <b>${esc(ex.name)}</b> (${ex.staple?"staple":"now "+esc(qtyText(effQty(ex),ex.unit)||"0")}).`;const c=$("#sCat");if(c&&CATS.includes(ex.category))c.value=ex.category;return;}
  const f=findItem(n);
  el.innerHTML=f?`New item. Is it your <button type="button" class="linkbtn" data-act="useName" data-name="${esc(f.name)}">${esc(f.name)}</button>?`:"This will be a new pantry item.";

function bindScanResult(){const i=$("#sName");if(!i)return;i.addEventListener("input",updateScanMatch);updateScanMatch();}
async function submitScan(to){
  const r=sheet.result;const name=$("#sName").value.trim();if(!name)return;
  const per=parseFloat($("#sQty").value);const qtyPer=per>0?round2(per):null;const unit=$("#sUnit").value;const pk=sheet.pk||1;const cat=$("#sCat").value;
  const total=round2((qtyPer||1)*pk);
  if(to==="pantry"){
    const res=await addToPantry(name,total,unit,cat,pk);
    if(res.err){toast(res.err);return;}
    toast(res.msg);
  }else{await addToList(name,total,unit,null);toast(`Added ${cap(name)} to your grocery list`);}
  const rem=$("#sRemember");
  if(barcodeServer&&rem&&rem.checked){
    const data={code:r.code,name:cap(name),qty:qtyPer,unit,category:cat,brand:r.brand||""};
    if(r.savedId)await store.update("barcodes",r.savedId,data);else await store.add("barcodes",data);
  }
  openSheet({type:"scan"}); // straight back to the camera for the next item
}
async function toggleTorch(){if(!scanStream)return;torchOn=!torchOn;try{await scanStream.getVideoTracks()[0].applyConstraints({advanced:[{torch:torchOn}]});}catch(e){torchOn=false;}const b=$("#torchBtn");if(b)b.textContent=torchOn?"Light off":"Light";}

/* ---------- toast ---------- */
let tT=null,tFn=null;
function toast(msg,action){const t=$("#toast");$("#toastMsg").textContent=msg;const a=$("#toastAct");tFn=action?action.fn:null;a.hidden=!action;if(action)a.textContent=action.label;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>{t.hidden=true;tFn=null;},action?6000:2800);}

function armed(btn){if(btn.dataset.armed==="1")return true;const orig=btn.textContent;btn.dataset.armed="1";btn.textContent=btn.dataset.confirm;setTimeout(()=>{if(btn.isConnected){btn.dataset.armed="";btn.textContent=orig;}},3200);return false;}
const curScale=r=>{const base=Math.max(1,+r.servings||1);return(sheet.servings||base)/base;};

  }
});
document.addEventListener("input",e=>{if(e.target.id==="pantryInput"){pFilter=e.target.value;renderPantry();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet)closeSheet();});

boot();
})();
</script>
