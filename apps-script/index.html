<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="color-scheme" content="dark">
<title>Pantry Pal</title>
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone column. Each tab draws its own header; full-screen panels (recipe, meal prep, edit)
   and bottom sheets (quick add, cooked, icons, scan) slide over it. Dark only, navy + blue-green. */
:root{
  --bg:#0B1220;--s1:#142033;--s2:#1C2A40;--s3:#26364F;--line:#26364F;--line2:#34486A;--nav:#0F1828;
  --ink:#EAF1F8;--ink2:#C9D6E6;--muted:#B5C3D6;--dim:#8A9AB0;--box:#6A7F9C;
  --accent:#5FD4C8;--accent-ink:#062421;--accent-soft:#123A44;--accent-text:#A8EEE6;--accent-line:#2C6A70;
  --low:#E8C9A0;--low-ink:#2B2218;--low-row:#221F2A;--low-chip:#2D2A30;--low-text:#EAD7BC;
  --out:#D9A3B8;--out-ink:#2A1620;--out-row:#221C2C;--out-chip:#2E2338;--out-text:#E6C3D0;
  --blue:#A9C8F2;--blue-ink:#0E1B2E;
  --tabh:70px;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button,a,.tap{transition:transform .12s ease,filter .12s ease}
button:active:not(:disabled),a:active,.tap:active{transform:scale(.95);filter:brightness(1.2)}
button:disabled{opacity:.5;cursor:default}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--s2);border:0;border-radius:10px;min-height:40px;padding:0 10px;width:100%;color:#fff}
textarea{padding:8px 10px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--dim)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 110px)}
h1,h2,h3{margin:0;font-weight:700;line-height:1.15}
h1{font-size:28px}h2{font-size:19px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.small{font-size:13px}

/* header */
.top{padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.toprow{display:flex;align-items:center;gap:6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;flex:1;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.titlerow{display:flex;align-items:center;gap:6px}
.titlerow .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sync{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.on::before{background:var(--accent)}.sync.bad::before{background:var(--out)}
.hbtn{flex:none;width:44px;height:44px;border-radius:14px;background:var(--s1);display:inline-flex;align-items:center;justify-content:center}
.hbtn.bright{background:var(--ink)}.hbtn.go{background:var(--accent)}
.hbtn svg{width:21px;height:21px}
.pill{height:44px;padding:0 14px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px}

/* buttons, chips, tags */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;background:var(--s1);font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.go{background:var(--accent);color:var(--accent-ink)}
.btn.need{background:var(--out);color:var(--out-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent-text)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.dash{background:transparent;border:1px dashed var(--line2);color:var(--muted);font-weight:600}
.btn.danger{background:transparent;color:var(--out)}
.btn.wide{flex:1}
.btn.big{height:50px;border-radius:14px;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--s1);font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.chip.prep{background:var(--accent-soft);color:var(--accent-text)}
.chip.prep[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip .n{color:var(--dim);font-weight:600;margin-left:2px}
.chip[aria-pressed="true"] .n{color:var(--line2)}
.opts{display:flex;flex-wrap:wrap;gap:4px}
.opt{height:32px;padding:0 10px;border-radius:8px;background:var(--s2);font-size:14px;font-weight:600;white-space:nowrap}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.opt.add{background:transparent;border:1px dashed var(--line2);color:var(--muted)}
.tag{flex:none;height:36px;min-width:64px;padding:0 10px;border-radius:9px;font-size:14px;font-weight:700;background:var(--accent-soft);color:var(--accent-text)}
.tag.low{background:var(--low-chip);color:var(--low-text)}
.tag.out{background:var(--out-chip);color:var(--out-text)}
.badge-s{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ready{background:var(--accent);color:var(--accent-ink)}.b-need{background:var(--out);color:var(--out-ink)}.b-low{background:var(--low);color:var(--low-ink)}.b-draft{background:var(--s3);color:var(--ink2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:40px;padding:3px;border-radius:10px;background:var(--s2);flex:none}
.seg button{border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg button.lowon[aria-pressed="true"]{background:var(--low);color:var(--low-ink)}
.seg button.outon[aria-pressed="true"]{background:var(--out);color:var(--out-ink)}
.seg.neutral button[aria-pressed="true"]{background:var(--s3);color:var(--ink)}
.stepper{flex:none;display:flex;align-items:center;height:40px;padding:0 2px;border-radius:10px;background:var(--s2)}
.stepper button{width:34px;height:36px;font-size:18px;font-weight:700}
.stepper .v{min-width:60px;text-align:center;font-weight:700;font-size:14px;white-space:nowrap}
.stepper.big{height:44px}.stepper.big .v{flex:1}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2.5px solid var(--box);display:inline-flex;align-items:center;justify-content:center}
.box.on{background:var(--accent);border:0}
.box svg{width:15px;height:15px}
.checkbtn{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center}

/* sections and rows */
.sec{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;min-height:30px}
.sech .hint{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 4px 4px 12px;border-radius:12px;background:var(--s1)}
.row.ck{padding-left:0;gap:4px}
.row.out{background:var(--out-row)}.row.low{background:var(--low-row)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.row .nm{font-size:16px;font-weight:700;color:#fff;overflow-wrap:anywhere}
.row .amt{font-weight:500;color:var(--ink2)}
.row .sub{font-size:13px;font-weight:600;color:var(--muted)}
.row .sub.out{color:var(--out-text)}.row .sub.low{color:var(--low-text)}
.row.done .nm,.row.done .amt{color:var(--dim);text-decoration:line-through}
.namebtn{text-align:left;display:flex;flex-direction:column;line-height:1.3;flex:1;min-width:0}
.linkbtn{color:var(--low);font-weight:700;font-size:13px;align-self:flex-start;height:22px}
.card{background:var(--s1);border-radius:16px;padding:10px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.note{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--s1);display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.note p{margin:0;flex:1}
.sheetlink{margin-top:20px;text-align:center;font-size:14px}

/* recipe cards + icons */
.ricon{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;font-size:22px;line-height:1;overflow:hidden}
.ricon svg{width:32px;height:32px;display:block}
.ricon img{width:100%;height:100%;object-fit:cover}
.t-meat{background:#3A2A2E}.t-sea{background:#1E3048}.t-grain{background:#33301F}.t-veg{background:#1F3A2E}.t-sweet{background:#3A2438}.t-drink{background:#2C2A48}.t-plain{background:#26364F}.t-tofu{background:#2A3340}
.shelf{margin-top:16px}
.shelf .sech{margin-bottom:6px}
.cnt{height:22px;padding:0 8px;border-radius:999px;background:var(--s2);color:var(--muted);font-size:13px;font-weight:700;display:inline-flex;align-items:center}
.cards{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.cards::-webkit-scrollbar{display:none}
.cards.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;margin:0;padding:0}
.rcard{flex:none;width:150px;display:flex;flex-direction:column;border-radius:18px;background:var(--s1);overflow:hidden;text-align:left;color:var(--ink)}
.cards.grid .rcard{width:auto}
.rcard .hero{height:88px;display:flex;align-items:center;justify-content:center;position:relative}
.rcard .hero svg{width:60px;height:60px}
.rcard .hero img{width:100%;height:100%;object-fit:cover}
.rcard .hero .emo{font-size:40px}
.rcard .hero .badge-s{position:absolute;top:8px;left:8px}
.rcard .body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.rcard .nm{font-size:15px;font-weight:700;line-height:1.25}
.rcard .sb{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .sb.out{color:var(--out-text)}.rcard .sb.low{color:var(--low-text)}
.rcard.draft .hero{opacity:.6}
.h-ready{background:var(--accent-soft)}.h-need{background:var(--out-chip)}.h-low{background:var(--low-chip)}.h-empty{background:var(--s3)}
.newcard{flex:none;width:150px;min-height:150px;border-radius:18px;border:2px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px}
.upnext{margin-top:14px;padding:10px;border-radius:18px;background:var(--s1);display:flex;flex-direction:column;gap:4px}
.unrow{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 10px 4px 4px;border-radius:12px;background:var(--s2);text-align:left;width:100%}
.unrow .nm{flex:1;min-width:0;font-size:16px;font-weight:700}
.searchbar{margin-top:10px;display:flex;align-items:center;gap:10px;height:48px;padding:0 4px 0 14px;border-radius:14px;background:var(--ink);color:var(--bg)}
.searchbar input{background:transparent;color:var(--bg);font-weight:600;font-size:16px;padding:0;min-height:44px}
.searchbar input::placeholder{color:#4A5A72}
.searchbar input:focus-visible,.find input:focus-visible,.fact input:focus-visible,.addline input:focus-visible{outline:none}
.searchbar button{width:40px;height:40px;border-radius:10px;background:#C9D6E6;color:var(--bg);font-size:20px;font-weight:700}
.reslist{display:flex;flex-direction:column;gap:4px;margin-top:10px}

/* pantry */
.addrow{margin-top:10px;display:flex;gap:6px}
.find{flex:1;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:var(--s1)}
.find input{background:transparent;padding:0;min-height:38px}
.lowbtn{height:42px;padding:0 12px;border-radius:12px;background:var(--low-row);color:var(--low);font-weight:700;font-size:14px}
.lowbtn[aria-pressed="true"]{background:var(--low);color:var(--low-ink)}
.banner{margin-top:12px;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:16px;background:#1E2D44;text-align:left;width:100%;color:var(--ink)}
.banner svg{width:36px;height:36px;flex:none}
.banner .bt{flex:1;display:flex;flex-direction:column;line-height:1.3}
.banner .go{height:36px;padding:0 12px;border-radius:10px;background:var(--blue);color:var(--blue-ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center}
.cath{display:flex;align-items:center;gap:8px;height:38px;width:100%;text-align:left;margin-top:12px}
.cath svg{width:30px;height:30px;flex:none}
.cath .t{flex:1;font-weight:700;font-size:18px}
.cath .c{font-size:13px;color:var(--muted)}
.editor{padding:12px;border-radius:16px;background:var(--s1);box-shadow:inset 0 0 0 2px var(--accent);display:flex;flex-direction:column;gap:10px}
.editor .lbl{font-size:13px;color:var(--muted)}
.editor .nameinp{background:transparent;font-size:19px;font-weight:700;padding:0 4px;margin-left:-4px}
.lowcheck{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:12px;background:var(--s2);text-align:left;width:100%}

/* grocery list */
.groupdot{width:12px;height:12px;border-radius:4px;flex:none}
.storetag{height:24px;padding:0 8px;border-radius:7px;background:var(--s2);color:var(--ink2);font-size:13px;font-weight:700}
.storetag.none{background:var(--s3);color:var(--accent-text)}
.lrow{display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:12px;background:var(--s1)}
.lrow .top1{display:flex;align-items:center;gap:6px;min-height:40px}
.lrow .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.picker{display:flex;flex-direction:column;gap:6px;padding:2px 4px 4px 46px}
.cart{margin-top:16px;padding:8px 10px 10px;border-radius:16px;background:var(--s1);display:flex;flex-direction:column;gap:2px}
.cart .crow{display:flex;align-items:center;gap:6px;min-height:40px}
.cart .crow span{color:var(--dim);text-decoration:line-through}
.suggest{margin-top:12px;padding:8px 10px 10px;border-radius:14px;background:var(--low-row);display:flex;flex-direction:column;gap:6px}
.suggest .t{font-size:14px;font-weight:700;color:var(--low-text)}
.suggest .opt{background:#2E2A33;color:#EEE0CC}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px);z-index:7;height:54px;padding:0 20px 0 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.fab svg{width:20px;height:20px}
.fab.pop{animation:pp-pop .45s ease-out,pp-glow .7s ease-out}
.spark{position:fixed;z-index:8;pointer-events:none;opacity:0;animation:pp-spark .75s ease-out forwards}
@keyframes pp-spark{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(90deg);opacity:0}}
@keyframes pp-pop{0%{transform:scale(1)}35%{transform:scale(1.14)}70%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes pp-glow{0%{box-shadow:0 0 0 0 rgba(95,212,200,.7)}100%{box-shadow:0 0 0 18px rgba(95,212,200,0)}}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:13px;font-weight:600;position:relative}
.tab svg{width:30px;height:30px}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}
.badge{position:absolute;top:6px;left:calc(50% + 10px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--out);color:var(--out-ink);font-size:12px;font-weight:700;line-height:20px;text-align:center}

/* panels: bottom sheets and full-screen pages */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(3,6,14,.62)}
.sheet{position:relative;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;background:var(--s1);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 10px}
.sheet.full{max-height:none;height:100%;border-radius:0;background:var(--bg);padding:0 0 calc(96px + env(safe-area-inset-bottom,0px))}
.sheet.full::before{display:none}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h2{flex:1;font-size:20px}
.pbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--bg)}
.pbar .sp{flex:1}
.pbar .lab{font-size:14px;font-weight:700;color:var(--accent-text);letter-spacing:.04em;text-transform:uppercase}
.pbody{padding:0 16px}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:10px max(16px,calc(50% - 284px)) calc(14px + env(safe-area-inset-bottom,0px));background:var(--nav);border-top:1px solid var(--line);display:flex;gap:8px}
.rhead{display:flex;align-items:center;gap:12px}
.pic{flex:none;position:relative;width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic svg{width:60px;height:60px}.pic .emo{font-size:44px}
.pic img{width:100%;height:100%;object-fit:cover}
.photohero{display:block;width:100%;height:200px;border-radius:20px;overflow:hidden;background:var(--s2)}
.photohero img{width:100%;height:100%;object-fit:cover;display:block}
.menu{margin-top:8px;padding:6px;border-radius:14px;background:var(--s1);box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:4px}
.menu button{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:10px;background:var(--s2);font-size:15px;font-weight:600;text-align:left}
.menu button svg{width:18px;height:18px}
.prepstrip{margin-top:12px;display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 12px 4px 8px;border-radius:14px;background:var(--accent-soft);color:var(--ink);text-align:left;width:100%}
.prepstrip svg{width:32px;height:32px;flex:none}
.step{display:flex;gap:10px;padding:10px;border-radius:12px;background:var(--s1);font-size:15px;line-height:1.45}
.num{flex:none;width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.fact{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:10px;background:var(--s1)}
.fact .k{font-size:13px;color:var(--muted);flex:none}
.fact input{background:transparent;padding:0;min-height:36px;font-weight:700;text-align:right}
.fact.st{padding:0 2px 0 10px}

.connect{padding:30px 0}

<script>
(function(){
"use strict";

/* =====================================================================

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap=s=>{s=String(s||"").trim();return s.charAt(0).toUpperCase()+s.slice(1);};
const round2=n=>Math.round(n*100)/100;

/* ---------- units ---------- */
const UNITS=["pcs","g","kg","ml","l","tsp","tbsp","cup","lb","oz","clove","can","bunch","pack","slice"];
// Canadian metric cup (250 ml), tbsp 15 ml, tsp 5 ml
const CONV={g:["m",1],kg:["m",1000],lb:["m",453.6],oz:["m",28.35],ml:["v",1],l:["v",1000],tsp:["v",5],tbsp:["v",15],cup:["v",250]};

const ALIAS={g:"g",gram:"g",grams:"g",gr:"g",kg:"kg",kgs:"kg",kilo:"kg",kilos:"kg",kilogram:"kg",kilograms:"kg",ml:"ml",millilitre:"ml",milliliter:"ml",millilitres:"ml",milliliters:"ml",l:"l",litre:"l",liter:"l",litres:"l",liters:"l",tsp:"tsp",teaspoon:"tsp",teaspoons:"tsp",tbsp:"tbsp",tbs:"tbsp",tablespoon:"tbsp",tablespoons:"tbsp",cup:"cup",cups:"cup",lb:"lb",lbs:"lb",pound:"lb",pounds:"lb",oz:"oz",ounce:"oz",ounces:"oz",clove:"clove",cloves:"clove",can:"can",cans:"can",tin:"can",tins:"can",bunch:"bunch",bunches:"bunch",pack:"pack",packs:"pack",package:"pack",packages:"pack",pkg:"pack",pcs:"pcs",pc:"pcs",piece:"pcs",pieces:"pcs",slice:"slice",slices:"slice"};
const STEP={g:50,kg:.25,ml:100,l:.25,lb:.5,oz:1,cup:.5,tbsp:1,tsp:1};
function convert(q,from,to){from=from||"";to=to||"";if(from===to||((from==="pcs"||from==="")&&(to==="pcs"||to==="")))return q;const a=CONV[from],b=CONV[to];if(!a||!b||a[0]!==b[0])return null;return q*a[1]/b[1];}
const FR=[[.25,"¼"],[.5,"½"],[.75,"¾"],[1/3,"⅓"],[2/3,"⅔"]];
function fmtNum(q,unit){if(q==null)return"";if(isCount(unit)||["tsp","tbsp","cup"].includes(unit)){const w=Math.floor(q+1e-9),f=q-w;if(f<.02)return String(w);for(const[v,g]of FR){if(Math.abs(f-v)<.02)return(w?w:"")+g;}}if(q>=10)return String(Math.round(q*10)/10);return String(round2(q));}
function unitLabel(u,q){if(!u||u==="pcs")return"";if(u==="l")return"L";if(CONV[u]||q===1||/s$/.test(u))return u;return/(x|ch|sh)$/.test(u)?u+"es":u+"s";}
function qtyText(q,u){if(q==null)return"";const n=fmtNum(q,u),l=unitLabel(u,q);return l?n+" "+l:n;}
function roundShort(q,u){if(q==null)return null;if(isCount(u)||u==="g"||u==="ml"||u==="oz")return Math.ceil(q-1e-9);if(u==="tsp"||u==="tbsp"||u==="cup")return Math.ceil(q*4-1e-9)/4;return Math.ceil(q*100-1e-9)/100;}
function normUnit(u,def){u=String(u==null?"":u).trim().toLowerCase().replace(/\.$/,"");return ALIAS[u]||(u||def);}
/* units from the sheet's Units tab (falls back to the built-in list) */
let unitsServer=false;
function unitList(){const seen=new Set(),out=[];const add=u=>{u=normUnit(u,"");if(u&&!seen.has(u)){seen.add(u);out.push(u);}};((S.units||[]).length?S.units.map(x=>x.name):UNITS).forEach(add);return out;}
function unitWord(w){w=String(w||"").toLowerCase();if(ALIAS[w])return ALIAS[w];const L=unitList();if(L.includes(w))return w;for(const u of L){if(w===u+"s"||w===u+"es")return u;}return"";}
function unitOptions(cur){const L=unitList();cur=cur||"pcs";if(!L.includes(cur))L.unshift(cur);return L.map(u=>`<option value="${esc(u)}" ${u===cur?"selected":""}>${u==="l"?"L":esc(u)}</option>`).join("")+(unitsServer?`<option value="__new">+ New unit…</option>`:"");}

/* ---------- parsing ---------- */
const UF={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125};
function parseLine(line){
  let s=String(line||"").trim().replace(/^[-*•▢□]\s*/,"");if(!s)return null;
  let qty=null,m;
  if((m=s.match(/^(\d+)\s*([½¼¾⅓⅔⅛])/))){qty=+m[1]+UF[m[2]];}
  else if((m=s.match(/^(\d+)\s+(\d+)\/(\d+)/))){qty=+m[1]+(+m[2])/(+m[3]);}
  else if((m=s.match(/^(\d+)\/(\d+)/))){qty=(+m[1])/(+m[2]);}
  else if((m=s.match(/^(\d*[.,]?\d+)/))){qty=parseFloat(m[1].replace(",","."));}
  else if((m=s.match(/^([½¼¾⅓⅔⅛])/))){qty=UF[m[1]];}
  if(m)s=s.slice(m[0].length).trim();
  let unit="";
  if(qty!=null){const um=s.match(/^([a-zA-Z]+)\.?(?=\s|$)/);const uw=um?unitWord(um[1]):"";if(uw&&s.slice(um[0].length).trim()){unit=uw;s=s.slice(um[0].length).trim();}if(!unit)unit="pcs";}
  s=s.replace(/^of\s+/i,"");
  let note="";
  const pm=s.match(/\(([^)]*)\)/);if(pm){note=pm[1].trim();s=s.replace(pm[0]," ");}
  const ci=s.indexOf(",");if(ci>0){note=[s.slice(ci+1).trim(),note].filter(Boolean).join(", ");s=s.slice(0,ci);}
  s=s.replace(/\s+(to taste|as needed|optional|for serving)\s*$/i,(x,y)=>{note=[y,note].filter(Boolean).join(", ");return"";});
  s=s.replace(/\s+/g," ").trim();

}
function lineOf(i){return[i.qty!=null?fmtNum(i.qty,i.unit):"",i.qty!=null&&i.unit&&i.unit!=="pcs"?(i.unit==="l"?"L":i.unit):"",i.name].filter(Boolean).join(" ")+(i.note?", "+i.note:"");}

/* ---------- names + categories ---------- */
function sing(w){if(w.length<4)return w;if(/(ss|us|is)$/.test(w))return w;if(/ies$/.test(w))return w.slice(0,-3)+"y";if(/(oes|ches|shes|xes)$/.test(w))return w.slice(0,-2);if(/s$/.test(w))return w.slice(0,-1);return w;}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9\s-]/g," ").replace(/\s+/g," ").trim().split(" ").filter(Boolean).map(sing).join(" ");}
const CATS=["Produce","Meat & fish","Dairy & eggs","Pantry","Spices","Frozen","Other"];
const CAT_WORDS=[
 ["Frozen",["frozen","ice cream"]],
 ["Spices",["salt","black pepper","peppercorn","cumin","paprika","cinnamon","oregano","thyme","chili flake","chilli flake","bay leaf","nutmeg","seasoning","curry powder","garlic powder","onion powder","turmeric","five spice","rosemary","dried"]],
 ["Dairy & eggs",["milk","butter","cheese","egg","yogurt","yoghurt","cream","parmesan","mozzarella","cheddar","feta","ghee"]],
 ["Meat & fish",["chicken","beef","pork","bacon","sausage","turkey","fish","salmon","shrimp","prawn","tuna","lamb","ham","steak","ground"]],
 ["Produce",["onion","garlic","tomato","lettuce","spinach","carrot","potato","pepper","apple","banana","lemon","lime","basil","cilantro","parsley","ginger","mushroom","cucumber","broccoli","scallion","avocado","celery","berry","berries","kale","cabbage","bok choy","zucchini","corn","herb","fruit","orange","grape","bean sprout"]],
 ["Pantry",["flour","sugar","rice","pasta","spaghetti","noodle","bread","oat","bean","lentil","stock","broth","sauce","oil","vinegar","honey","baking","yeast","cereal","chickpea","tortilla","cracker","coffee","tea","syrup","ketchup","mustard","mayo","paste","can"]]
];
function guessCat(name){const n=" "+String(name||"").toLowerCase()+" ";for(const[c,ws]of CAT_WORDS){for(const w of ws){if(n.includes(" "+w)||n.includes(w+" "))return c;}}return"Other";}

/* =====================================================================
   SYNC — the Google Sheet is the source of truth.
   Changes apply on screen right away, then go to the sheet in batches.
   ===================================================================== */
const isGAS=!!(window.google&&google.script&&google.script.run);
const COLLS=["items","recipes","list","barcodes","stores"];
let S={items:[],recipes:[],list:[],barcodes:[],units:[],stores:[]};
let barcodeServer=true; // false when the sheet's Code.gs predates the Barcodes tab
let ready=false,auth="ok",KEY="",sheetUrl="",lastSync=0,syncState="connecting";
let queue=[],inflight=false,flushT=null,retryT=null;
try{KEY=localStorage.getItem("pc.key")||"";sheetUrl=localStorage.getItem("pc.sheet")||"";}catch(e){}
function setKey(k){KEY=String(k||"").trim();try{localStorage.setItem("pc.key",KEY);}catch(e){}}
async function initKey(){
  if(isGAS){await new Promise(res=>{try{google.script.url.getLocation(loc=>{const k=loc&&loc.parameter&&loc.parameter.key;if(k)setKey(k);res();});}catch(e){res();}});}
  else{try{const p=new URLSearchParams(location.search);const k=p.get("key");if(k){setKey(k);p.delete("key");history.replaceState(null,"",location.pathname+(p.toString()?"?"+p:"")+location.hash);}}catch(e){}}
}
function callApi(payload){
  if(isGAS)return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(JSON.stringify(payload)));
  return fetch(API_URL,{method:"POST",body:JSON.stringify(payload),redirect:"follow"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});
}
const uid=()=>("x"+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
function applyLocal(o){const arr=S[o.coll];if(o.op==="photo"){const x=arr.find(d=>d.id===o.id);if(x)x.photoLocal=o.data.local;return;}if(o.op==="add"){const rec=Object.assign({id:o.id},o.data);const i=arr.findIndex(d=>d.id===o.id);if(i>=0)arr[i]=rec;else arr.push(rec);}else if(o.op==="update"){const x=arr.find(d=>d.id===o.id);if(x)Object.assign(x,o.data);}else S[o.coll]=arr.filter(d=>d.id!==o.id);}
function enqueue(o){queue.push(o);applyLocal(o);onData();clearTimeout(flushT);flushT=setTimeout(flush,350);}
const store={
  async add(c,data){const id=uid();enqueue({op:"add",coll:c,id,data});return id;},
  async update(c,id,data){enqueue({op:"update",coll:c,id,data});},
  async del(c,id){enqueue({op:"del",coll:c,id});}
};
function wire(o){if(o.op==="del")return o;if(o.op==="photo")return{op:"photo",coll:o.coll,id:o.id,data:{b64:o.data.b64,mime:o.data.mime,name:o.data.name}};const d=Object.assign({},o.data);delete d.photoLocal;if(o.coll==="recipes"&&Array.isArray(d.ingredients))d.ingredients=d.ingredients.map(lineOf).join("\n");if(o.coll==="recipes"&&Array.isArray(d.prepSteps))d.prepSteps=d.prepSteps.join("\n");return{op:o.op,coll:o.coll,id:o.id,data:d};}
// Rows from before Track/Level existed: staples and weighed items become Have / Low / Out, counted items stay counted
function normItem(r){
  const unit=normUnit(r.unit,"pcs"),qty=+r.qty||0;
  let track=String(r.track||"").toLowerCase();if(track!=="count"&&track!=="status")track=r.staple?"status":isCount(unit)?"count":"status";
  let level=String(r.level||"").toLowerCase();if(!["have","low","out"].includes(level))level=track==="status"?(r.staple?(r.inStock===false?"out":"have"):(qty>0?"have":"out")):"";
  if(track==="count"&&level!=="low")level="";
  return Object.assign({},r,{qty,unit:track==="count"?unit:normUnit(r.unit,""),staple:!!r.staple,inStock:!!r.inStock,track,level,store:String(r.store||"").trim()});
}
function normalize(st){
  st=st||{};
  return{
    items:(st.items||[]).map(normItem),
    recipes:(st.recipes||[]).map(r=>Object.assign({},r,{upNext:r.upNext==null||r.upNext===""||isNaN(+r.upNext)?null:+r.upNext,prep:!!r.prep,batch:r.batch==null||r.batch===""?null:+r.batch,photo:String(r.photo||"").trim(),prepSteps:Array.isArray(r.prepSteps)?r.prepSteps:String(r.prepSteps||"").split(/\n/).map(s=>s.trim()).filter(Boolean),draft:!!r.draft,servings:Math.max(1,+r.servings||1),ingredients:Array.isArray(r.ingredients)?r.ingredients:String(r.ingredients||"").split(/\n/).map(parseLine).filter(Boolean)})),
    list:(st.list||[]).map(r=>Object.assign({},r,{qty:r.qty==null||r.qty===""?null:+r.qty,unit:normUnit(r.unit,""),for:Array.isArray(r.for)?r.for:String(r.for||"").split(",").map(s=>s.trim()).filter(Boolean),checked:!!r.checked,store:String(r.store||"").trim()})),
    barcodes:(st.barcodes||[]).map(r=>Object.assign({},r,{code:String(r.code||""),qty:r.qty==null||r.qty===""?null:+r.qty,unit:normUnit(r.unit,"pcs")})),
    units:(st.units||[]).filter(r=>String(r.name||"").trim()),
    stores:(st.stores||[]).filter(r=>String(r.name||"").trim())
  };
}
async function flush(){
  if(auth!=="ok")return;
  if(inflight){clearTimeout(flushT);flushT=setTimeout(flush,400);return;}
  clearTimeout(retryT);
  const ops=queue.slice();inflight=true;setSync(ops.length?"saving":ready?"loading":"connecting");
  let res;
  try{res=await callApi({key:KEY,ops:ops.map(wire)});}catch(e){res={ok:false,error:"network"};}
  inflight=false;
  if(res&&res.ok){
    queue=queue.slice(ops.length);
    if(res.sheetUrl){sheetUrl=res.sheetUrl;try{localStorage.setItem("pc.sheet",sheetUrl);}catch(e){}}
    barcodeServer=!!(res.state&&Array.isArray(res.state.barcodes));
    unitsServer=!!(res.state&&Array.isArray(res.state.units));
    iconServer=!!(res.state&&(res.state.recipes||[]).some(r=>"icon" in r));
    storesServer=!!(res.state&&Array.isArray(res.state.stores));

    S=normalize(res.state);queue.forEach(applyLocal);
    const first=!ready;ready=true;lastSync=Date.now();setSync("ok");
    if(first)render();else onData();
    if(queue.length){clearTimeout(flushT);flushT=setTimeout(flush,350);}
    return;
  }
  if(res&&res.error==="bad_key"){auth="need";setSync("off");render("That key didn't work. Check it in your sheet: Pantry Pal menu → Show app key and link.");return;}
  setSync("error");
  if(res&&res.message&&res.error!=="network")toast(res.message);
  else toast(ops.length?"Can't reach your sheet. Your changes will retry.":"Can't reach your sheet. Tap the status to retry.");
  retryT=setTimeout(flush,15000);
}

/* ---------- pantry model ----------
   Each item is tracked one of two ways (Track column):
   - count:  whole packages (Amount + Unit: each, can, bottle, pack…); Level "low" = running low
   - status: Have / Low / Out only (Level column); no measuring
   The old Staple / In stock columns are kept in step so older copies of the app still read it right. */
const pendQ={},pendT={};
const PKG=["pcs","carton","can","bottle","pack","bag","box","jar","bunch"];
const DEFAULT_STORES=["Costco","Asian market","Farmer's market"];
const STORE_COLORS=["#A9C8F2","#E8C9A0","#5FD4C8","#D9A3B8","#C4B8F5","#FFE08A"];
function effQty(it){return pendQ[it.id]!==undefined?pendQ[it.id]:(+it.qty||0);}
const isCounted=it=>it.track==="count";
function levelOf(it){if(isCounted(it))return effQty(it)<=0?"out":(it.level==="low"?"low":"have");return it.level||"have";}
const isOut=it=>levelOf(it)==="out";
function pkgUnits(){const seen=new Set(),out=[];const add=u=>{u=normUnit(u,"");if(u&&isCount(u)&&!seen.has(u)){seen.add(u);out.push(u);}};PKG.forEach(add);(S.units||[]).forEach(x=>add(x.name));S.items.forEach(i=>{if(isCounted(i))add(i.unit);});return out;}
const unitName=u=>!u||u==="pcs"?"each":u==="l"?"L":u;
function itemAmount(it){if(!isCounted(it))return"";const q=effQty(it);return q<=0?"Out":qtyText(q,it.unit)||String(q);}
function storeList(){const seen=new Set(),out=[];const add=s=>{s=String(s||"").trim();if(s&&!seen.has(s.toLowerCase())){seen.add(s.toLowerCase());out.push(s);}};((S.stores||[]).length?S.stores.map(x=>x.name):DEFAULT_STORES).forEach(add);S.list.forEach(l=>add(l.store));S.items.forEach(i=>add(i.store));return out;}
const storeColor=s=>{if(!s)return"#6A7F9C";const i=storeList().findIndex(x=>x.toLowerCase()===String(s).toLowerCase());return STORE_COLORS[(i<0?0:i)%STORE_COLORS.length];};
function findItem(name){const n=norm(name);if(!n)return null;let best=null,bl=0;for(const it of S.items){const m=norm(it.name);if(!m)continue;if(m===n)return it;if((n.endsWith(" "+m)||m.endsWith(" "+n))&&m.length>bl){best=it;bl=m.length;}}return best;}
function findExact(name){const n=norm(name);return S.items.find(it=>norm(it.name)===n)||null;}
const isOptional=ing=>/\boptional\b/i.test(ing.note||"")||/\(optional\)/i.test(ing.name||"");
// Optional ingredients you don't have are marked "opt" and never block a recipe
function check(ing,scale){const r=checkRaw(ing,scale);if(r.s!=="have"&&isOptional(ing)){r.raw=r.s;r.s="opt";}return r;}
function checkRaw(ing,scale){
  const it=findItem(ing.name);const need=ing.qty==null?null:ing.qty*scale;const u=ing.unit||"";
  if(!it)return{s:"miss",item:null,need,unit:u};
  const lv=levelOf(it);
  if(lv==="out")return{s:"miss",item:it,need,unit:u};
  // Only a counted item in the same unit ("3 eggs" vs 2 eggs) can come up short
  if(isCounted(it)&&need!=null&&normUnit(u,"pcs")===it.unit){const hq=effQty(it);if(hq+1e-9<need)return{s:"short",item:it,need,have:hq,unit:u,low:true};}
  return{s:"have",item:it,need,unit:u,low:lv==="low"};
}
function stats(r,scale){
  const rows=(r.ingredients||[]).map((i,idx)=>Object.assign({ing:i,i:idx},check(i,scale||1)));
  const opt=rows.filter(x=>x.s==="opt").length;const total=rows.length-opt;
  const missRows=rows.filter(x=>x.s==="miss"||x.s==="short");const lowRows=rows.filter(x=>x.s==="have"&&x.low);
  const status=!rows.length?"empty":missRows.length?"need":lowRows.length?"low":"ready";
  return{rows,total,opt,miss:missRows.length,lowN:lowRows.length,missRows,lowRows,status};
}
const isDraft=r=>!!r.draft||!(r.ingredients||[]).length;
function listEntry(name){const n=norm(name);return S.list.find(l=>!l.checked&&norm(l.name)===n)||null;}
const photoSrc=r=>{if(!r)return"";if(r.photoLocal)return r.photoLocal;const p=String(r.photo||"").trim();if(!p)return"";return/^https?:/.test(p)?p:"https://drive.google.com/thumbnail?id="+encodeURIComponent(p)+"&sz=w1000";};
const scaleOf=r=>{const base=Math.max(1,+r.servings||1);return(sheet&&sheet.servings||base)/base;};
// Bigger batches read better in bigger units: 6 tsp → 2 tbsp, 12 tbsp → ¾ cup
function niceAmt(q,u){if(q==null)return"";u=u||"";if(u==="tsp"&&q>=3&&Math.abs(q/3-Math.round(q/3*4)/4)<1e-6){q=q/3;u="tbsp";}if(u==="tbsp"&&q>=4&&Math.abs(q/16-Math.round(q/16*4)/4)<1e-6){q=q/16;u="cup";}const t=qtyText(round2(q),u);return u==="cup"&&q>1+1e-9?t+"s":t;}

const statusRank={ready:0,low:1,need:2,empty:3};

function renderRecipes(){

    ${un.map((r,i)=>{const c=cardBits(r);return reorder?`<div class="unrow">${smallPic(r,"ricon")}<span class="nm">${esc(r.name)}</span><button class="btn" style="width:40px;padding:0" data-act="unUp" data-id="${esc(r.id)}" ${i?"":"disabled"} aria-label="Move up">↑</button><button class="btn ghost" style="width:40px;padding:0" data-act="unRemove" data-id="${esc(r.id)}" aria-label="Take off Up next">×</button></div>`:`<button class="unrow" data-act="openRecipe" data-id="${esc(r.id)}">${smallPic(r,"ricon")}<span class="nm">${esc(r.name)}</span>${c.badge}</button>`;}).join("")}</section>`;

function ingRows(r,st,scale,mult){
  const got=sheet.got||(sheet.got={});
  const one=(x,kind)=>{
    const i=x.i,ing=x.ing,on=!!got[i];
    const amt=x.need!=null?niceAmt(x.need,ing.unit):"";
    const per=mult>1&&ing.qty!=null?niceAmt(ing.qty*scale/mult,ing.unit)+" × "+mult:"";
    const onList=!!listEntry(ing.name);
    let sub="",btns="",cls="";
    if(kind==="buy"){
      cls="out";
      const why=x.s==="short"?`Have ${qtyText(x.have,x.item.unit)}`:x.item?"Out":"Not in your pantry";
      sub=`<span class="sub out">${esc([why,onList?"on your list":"",per].filter(Boolean).join(" · "))}</span>`;
      btns=`<button class="btn soft" data-act="haveIt" data-i="${i}">I have it</button>${onList?"":`<button class="btn need" data-act="addOne" data-i="${i}" aria-label="Add ${esc(ing.name)} to the list">+ List</button>`}`;
    }else if(x.s==="opt"){
      sub=`<span class="sub">${esc(["optional · not in your pantry",per].filter(Boolean).join(" · "))}</span>`;
      btns=onList?"":`<button class="btn" data-act="addOne" data-i="${i}">+ List</button>`;
    }else{
      const it=x.item,lv=levelOf(it);cls=lv==="low"?"low":"";
      const note=[ing.note&&!/\boptional\b/i.test(ing.note)?ing.note:"",isOptional(ing)?"optional":"",per].filter(Boolean).join(" · ");
      sub=note?`<span class="sub">${esc(note)}</span>`:"";
      if(lv==="low"&&!onList)sub+=`<button class="linkbtn" data-act="addOne" data-i="${i}">+ Add to list</button>`;
      btns=`<button class="tag ${lv==="low"?"low":""}" data-act="cycleLevel" data-id="${esc(it.id)}" aria-label="${esc(it.name)}: ${lv}. Tap to change">${lv==="low"?"Low":"✓ Have"}</button>`;
    }
    return`<div class="row ck ${cls} ${on?"done":""}"><button class="checkbtn" data-act="tick" data-i="${i}" aria-pressed="${on}" aria-label="${on?"Untick":"Tick off"} ${esc(ing.name)}"><span class="box ${on?"on":""}">${on?SVG.check:""}</span></button><span class="main"><span class="nm">${esc(cap(ing.name))}${amt?`<span class="amt"> – ${esc(amt)}</span>`:""}</span>${sub}</span>${btns}</div>`;
  };
  const buy=st.missRows,have=st.rows.filter(x=>x.s==="have"||x.s==="opt");
  return{buy:buy.map(x=>one(x,"buy")).join(""),have:have.map(x=>one(x,"have")).join(""),nBuy:buy.length,nAdd:buy.filter(x=>!listEntry(x.ing.name)).length};
}

  const meta=[mealOf(r),String(r.cuisine||"").trim(),String(r.cookTime||"").trim(),String(r.difficulty||"").trim()].filter(Boolean).join(" · ");
  const last=r.lastCooked?`Last cooked ${new Date(r.lastCooked).toLocaleDateString([],{month:"short",day:"numeric"})}`:"";

function sheetRecipe(){

/* ---------- barcode scanning ----------
   1. Camera + barcode reader (Chrome's built-in one on Android; a fallback reader loads on other phones)
   2. Lookup: your saved barcodes first, then Open Food Facts (free product database)
   3. Confirm the name and size, add to pantry or list, and remember the barcode for next time */
const SCAN_BTN=dest=>`<button class="btn icon" type="button" data-act="scan" data-dest="${dest}" aria-label="Scan a barcode" title="Scan a barcode"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/></svg></button>`;
let scanStream=null,scanTimer=null,scanLast="",scanHits=0,scanDest="pantry",detectorP=null,torchOn=false;
const normCode=c=>String(c||"").replace(/\D/g,"").replace(/^0+/,"");
const canCamera=()=>!isGAS&&window.isSecureContext&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
function getDetector(){
  if(detectorP)return detectorP;
  const formats=["ean_13","ean_8","upc_a","upc_e"];
  detectorP=(async()=>{
    if("BarcodeDetector" in window){try{const sup=await BarcodeDetector.getSupportedFormats();const f=formats.filter(x=>sup.includes(x));if(f.length)return new BarcodeDetector({formats:f});}catch(e){}}
    const m=await import("https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/es/ponyfill.js");
    return new m.BarcodeDetector({formats});
  })();
  detectorP.catch(()=>{detectorP=null;});
  return detectorP;
}
function sheetScan(){
  const cam=canCamera();
  return head("Scan a barcode",`<span>${scanDest==="list"?"Adds to your grocery list":"Adds to your pantry"}</span>`)+`<div class="stack">
    ${cam?`<div class="scanbox"><video id="scanVideo" playsinline muted></video><div class="scanframe" aria-hidden="true"></div><button class="btn small torch" type="button" data-act="torch" id="torchBtn" hidden>Light</button></div><p id="scanStatus" class="scanstatus" aria-live="polite">Starting camera…</p>`
      :`<p class="scanstatus">${isGAS?"The camera only works in the installed app (your GitHub Pages link). You can still type the barcode number below.":"This browser can't open the camera. Type the barcode number below."}</p>`}
    <form id="codeForm" class="addbar" autocomplete="off"><input id="codeInput" inputmode="numeric" placeholder="Or type the barcode number" aria-label="Barcode number"><button class="btn" type="submit">Look up</button></form>
  </div>`;
}
async function startScan(){
  if(!canCamera())return;
  const v=$("#scanVideo"),setS=t=>{const st=$("#scanStatus");if(st)st.textContent=t;};
  scanLast="";scanHits=0;torchOn=false;
  try{
    const det=getDetector();
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!sheet||sheet.type!=="scan"||!v||!v.isConnected){stream.getTracks().forEach(t=>t.stop());return;}
    scanStream=stream;v.srcObject=stream;await v.play();
    try{const caps=stream.getVideoTracks()[0].getCapabilities();if(caps&&caps.torch)$("#torchBtn").hidden=false;}catch(e){}
    setS("Loading the barcode reader…");
    const detector=await det;
    if(!scanStream)return;
    setS("Hold the barcode inside the box");
    const tick=async()=>{
      if(!scanStream)return;
      try{
        if(v.readyState>=2){
          const codes=await detector.detect(v);const c=codes&&codes[0]&&codes[0].rawValue;
          // Accept a code only after reading it twice in a row, to avoid misreads
          if(c){if(c===scanLast)scanHits++;else{scanLast=c;scanHits=1;}if(scanHits>=2){onScanned(c);return;}}
        }
      }catch(e){}
      if(scanStream)scanTimer=setTimeout(tick,120);
    };
    tick();
  }catch(e){
    stopScan();
    const n=e&&e.name;
    setS(n==="NotAllowedError"||n==="SecurityError"?"Camera access is blocked. Allow the camera for this site in Chrome's site settings, or type the number below."
      :n==="NotFoundError"?"No camera found. Type the number below.":"Couldn't start the scanner. Type the number below.");
  }
}
function stopScan(){clearTimeout(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}}

  const s={type:"scanResult",code:String(code).replace(/\D/g,""),loading:true,pk:1};openSheet(s);

  if(sheet!==s)return;s.loading=false;s.result=r;renderSheet(true);
}
// "900 g", "1.5 L", "6 x 355 ml", "75 cl" → {qty, unit}
function parseQty(s){
  s=String(s||"").toLowerCase().replace(/(\d),(\d)/g,"$1.$2");
  let n=1,m=s.match(/(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(kg|g|mg|ml|cl|l|oz|lb)\b/);
  if(m){n=+m[1];m=[m[0],m[2],m[3]];}else m=s.match(/(\d+(?:\.\d+)?)\s*(kg|g|mg|ml|cl|l|oz|lb)\b/);
  if(!m)return null;let q=+m[1]*n,u=m[2];
  if(u==="cl"){q*=10;u="ml";}if(u==="mg"){q/=1000;u="g";}
  return q>0?{qty:round2(q),unit:u}:null;
}
const cleanName=s=>cap(String(s||"").replace(/\s*[-–,(]?\s*\d+(?:[.,]\d+)?\s*(kg|g|mg|ml|cl|l|oz|lb)\b.*$/i,"").replace(/\s+/g," ").trim());
async function fetchOFF(code){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json?fields=product_name,product_name_en,generic_name,brands,quantity",{signal:ctl.signal});
    if(r.status===404)return null;
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();return j&&j.status===1&&j.product?j.product:null;
  }finally{clearTimeout(to);}
}
async function lookupBarcode(code){
  const k=normCode(code);
  const saved=S.barcodes.find(b=>normCode(b.code)===k);
  if(saved)return{source:"saved",code,name:saved.name,qty:saved.qty,unit:saved.unit,category:saved.category,brand:saved.brand,savedId:saved.id};
  try{
    let p=await fetchOFF(code);
    if(!p&&code.length===12)p=await fetchOFF("0"+code); // UPC-A is also stored as 13-digit EAN
    if(!p)return{source:"none",code};
    const name=cleanName(p.product_name_en||p.product_name||p.generic_name||"");const q=parseQty(p.quantity);
    return{source:"off",code,name,qty:q?q.qty:null,unit:q?q.unit:"pcs",category:guessCat(name),brand:String(p.brands||"").split(",")[0].trim()};
  }catch(e){return{source:"offline",code};}
}

async function addToList(name,qty,unit,forRecipe,storeName){

    else{setItem(it.id,{level:s.level||"have"});msg=`${it.name}: ${cap(s.level||"have")}`;}
  }else{
    const cat=($("#qaCat")||{}).value||guessCat(name);
    await newItem(s.track==="status"?{name,track:"status",level:s.level||"have",cat}:{name,track:"count",qty:s.qty,unit:s.unit||"pcs",cat});msg=`Added ${name} to ${cat}`;
  }
  toast(msg);
  if(next){s.q="";qaReset(s);renderSheet(true);}else closeSheet();
}
async function cookSave(none){
  const r=curRecipe();if(!r)return;const pick=sheet.pick||{};const flag=[];let changed=0;
  if(!none)for(const it of cookItems(r)){
    const v=pick[it.id];if(!v||v==="fine")continue;changed++;
    if(v==="low"){setItem(it.id,{level:"low"});flag.push(it);}
    else if(v==="out"){setItem(it.id,{level:"out"});flag.push(it);}
    else if(v==="minus"){const q=Math.max(0,effQty(it)-1);delete pendQ[it.id];store.update("items",it.id,{qty:q});if(q<=1)flag.push(it);}
  }
  store.update("recipes",r.id,{lastCooked:Date.now()});
  let n=0;if(sheet.toList!==false)for(const it of flag){if(!listEntry(it.name)&&await addToList(it.name,null,"",null))n++;}
  // back to the recipe, skipping the meal prep page
  let back=sheet.prev;if(back&&back.type==="prep")back=back.prev;
  if(back){sheet=back;renderSheet(true);}else closeAll();
  toast(`Enjoy! ${changed?`Saved ${changed} change${changed>1?"s":""}`:"Pantry unchanged"}${n?`, ${n} added to your list`:""}.`);
}
async function edSave(){
  const s=sheet,ed=s.ed;
  const extra=$("#edAdd");if(extra&&extra.value.trim()){const p=parseLine(extra.value);if(p)ed.ings.push({name:p.name,qty:p.qty,unit:p.qty!=null?p.unit:"",note:p.note});}
  const name=cap(String(ed.name||"").trim());if(!name){toast("Give the recipe a name first.");const i=document.querySelector('[data-f="name"]');if(i)i.focus();return;}
  const ings=ed.ings.filter(g=>String(g.name||"").trim()).map(g=>({name:String(g.name).trim(),qty:g.qty==null||g.qty===""||isNaN(+g.qty)?null:+g.qty,unit:g.qty==null||g.qty===""?"":(g.unit||"pcs"),note:g.note||""}));
  const data={name,servings:ed.servings,ingredients:ings,steps:ed.steps.map(x=>String(x).trim()).filter(Boolean).join("\n"),link:String(ed.link||"").trim(),draft:!!ed.draft,icon:ed.icon||"",meal:ed.meal||"",cuisine:String(ed.cuisine||"").trim(),difficulty:ed.difficulty||"",cookTime:String(ed.cookTime||"").trim(),
    prep:!!ed.prep,batch:ed.batch===""||ed.batch==null?null:+ed.batch,batchName:String(ed.batchName||"").trim(),keeps:String(ed.keeps||"").trim(),prepSteps:ed.prepSteps.map(x=>String(x).trim()).filter(Boolean),reheat:String(ed.reheat||"").trim()};
  if(s.id){await store.update("recipes",s.id,data);const r=S.recipes.find(x=>x.id===s.id);if(ed.photoPending&&r)sendPhoto(r,ed.photoPending);closeSheet();toast("Recipe saved");return;}
  const id=await store.add("recipes",data);const r=S.recipes.find(x=>x.id===id);if(ed.photoPending&&r)sendPhoto(r,ed.photoPending);
  sheet=null;openSheet({type:"recipe",id});toast("Recipe added");
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab&&!t.dataset.act){if(sheet)closeAll();setTab(t.dataset.tab);return;}
  const a=t.dataset.act,id=t.dataset.id;
  if(t.dataset.confirm&&!armed(t))return;
  const r=sheet&&["recipe","prep","cooked"].includes(sheet.type)?curRecipe():null;
  const ed=sheet&&sheet.type==="editRecipe"?sheet.ed:null;
  switch(a){
    case"refreshNow":if(auth==="ok")flush();break;
    case"close":closeSheet();break;
    /* recipes home */
    case"toggleSearch":searchOpen=!searchOpen;if(!searchOpen)searchQ="";render();if(searchOpen)setTimeout(()=>{const i=$("#rSearch");if(i)i.focus();},30);break;
    case"mFilter":mFilter=t.dataset.k;save("pc.meal",mFilter);renderRecipes();break;
    case"newRecipe":openSheet({type:"editRecipe",id:null,ed:edFrom({})});break;
    case"openRecipe":openSheet({type:"recipe",id});break;
    case"reorder":reorder=!reorder;renderRecipes();break;
    case"unUp":{const un=S.recipes.filter(x=>x.upNext!=null).sort((x,y)=>x.upNext-y.upNext);const i=un.findIndex(x=>x.id===id);if(i>0){const p=un[i-1],c=un[i];const pv=p.upNext,cv=c.upNext===pv?pv+1:c.upNext;store.update("recipes",c.id,{upNext:pv});store.update("recipes",p.id,{upNext:cv});}break;}
    case"unRemove":store.update("recipes",id,{upNext:null});break;
    /* recipe page */
    case"toggleUpNext":{if(!r)break;if(r.upNext!=null){store.update("recipes",r.id,{upNext:null});toast("Taken off Up next");}else{const mx=Math.max(0,...S.recipes.map(x=>x.upNext!=null?+x.upNext:0));store.update("recipes",r.id,{upNext:mx+1});toast("Added to Up next");}break;}
    case"editRecipe":if(r)openSheet({type:"editRecipe",id:r.id,ed:edFrom(r)},true);break;
    case"picMenu":sheet.menu=!sheet.menu;renderSheet();break;
    case"pickIcon":sheet.menu=false;openSheet(sheet.type==="editRecipe"?{type:"iconPick",forEdit:true}:{type:"iconPick",id:sheet.id},true);break;
    case"pickPhoto":sheet.menu=false;photoFor={type:sheet.type,id:sheet.id};renderSheet();{const inp=$("#photoInput");inp.value="";inp.click();}break;
    case"removePhoto":sheet.menu=false;if(ed){ed.photoPending=null;}if(sheet.id){store.update("recipes",sheet.id,{photo:"",photoLocal:""});toast("Back to the icon");}renderSheet();break;
    case"setIcon":{const v=t.dataset.icon;if(sheet.forEdit){if(sheet.prev&&sheet.prev.ed)sheet.prev.ed.icon=v;}else if(sheet.id)await store.update("recipes",sheet.id,{icon:v});closeSheet();break;}
    case"serv":{if(!r)break;const base=Math.max(1,+r.servings||1);sheet.servings=Math.max(1,(sheet.servings||base)+ +t.dataset.d);renderSheet();break;}
    case"tick":{const g=sheet.got||(sheet.got={});g[t.dataset.i]=!g[t.dataset.i];renderSheet();break;}
    case"haveIt":{const ing=ingAt(t.dataset.i);if(!ing)break;const n=haveIt(ing.name);toast(`${n} is in your pantry now`);break;}
    case"addOne":{const ing=ingAt(t.dataset.i);if(!ing||!r)break;await addToList(ing.name,null,"",r.name);toast(`Added ${cap(ing.name)} to your list`);renderSheet();break;}
    case"addMissing":{if(!r)break;t.disabled=true;const n=await addMissing(r,sheet.type==="prep"?(sheet.batch||2):scaleOf(r));toast(n?`Added ${n} item${n>1?"s":""} to your grocery list`:"Already on your list");renderSheet();break;}
    case"cycleLevel":{const it=S.items.find(x=>x.id===id);if(it)cycleLevel(it);break;}
    case"cookOpen":if(r){const pick={};cookItems(r).forEach(it=>{if(levelOf(it)==="low")pick[it.id]="low";});openSheet({type:"cooked",id:r.id,pick,toList:true},true);}break;
    case"openPrep":if(r)openSheet({type:"prep",id:r.id,batch:2},true);break;
    case"batch":sheet.batch=+t.dataset.n;renderSheet();break;
    case"prepStep":{const d=sheet.done||(sheet.done={});d[t.dataset.i]=!d[t.dataset.i];renderSheet();break;}
    case"setDraft":if(r){await store.update("recipes",r.id,{draft:t.dataset.v==="1"});toast(t.dataset.v==="1"?"Moved to drafts":"Recipe marked finished");}break;
    case"delRecipe":{const rid=sheet.id;closeAll();await store.del("recipes",rid);toast("Recipe deleted");break;}
    /* cooked */
    case"cookPick":sheet.pick[id]=t.dataset.v;renderSheet();break;
    case"cookToList":sheet.toList=sheet.toList===false;renderSheet();break;
    case"cookSave":t.disabled=true;await cookSave(t.dataset.none==="1");break;
    /* edit recipe */
    case"edMeal":ed.meal=ed.meal.toLowerCase()===t.dataset.k.toLowerCase()?"":t.dataset.k;renderSheet();break;
    case"edMealNew":{const m=askNew("meal type","Snack or Side");if(m){ed.meal=m;renderSheet();}break;}
    case"edServ":ed.servings=Math.max(1,ed.servings+ +t.dataset.d);renderSheet();break;
    case"edDiff":ed.difficulty=ed.difficulty===t.dataset.k?"":t.dataset.k;renderSheet();break;
    case"edUnit":ed.openUnit=ed.openUnit===+t.dataset.i?-1:+t.dataset.i;renderSheet();break;
    case"edSetUnit":{const g=ed.ings[+t.dataset.i];if(g){g.unit=t.dataset.u;if(g.qty==null)g.qty=1;}ed.openUnit=-1;renderSheet();break;}
    case"edDelIng":ed.ings.splice(+t.dataset.i,1);ed.openUnit=-1;renderSheet();break;
    case"edOpt":{const g=ed.ings[+t.dataset.i];if(!g)break;g.note=isOptional(g)?String(g.note||"").replace(/,?\s*\boptional\b/i,"").replace(/^,\s*/,"").trim():[g.note,"optional"].filter(Boolean).join(", ");renderSheet();break;}
    case"edPaste":ed.paste=!ed.paste;renderSheet();if(ed.paste)setTimeout(()=>{const b=$("#edPasteBox");if(b)b.focus();},30);break;
    case"edPasteGo":{const b=$("#edPasteBox");if(b)String(b.value).split(/\n/).map(parseLine).filter(Boolean).forEach(p=>ed.ings.push({name:p.name,qty:p.qty,unit:p.qty!=null?p.unit:"",note:p.note}));ed.paste=false;renderSheet();break;}
    case"edAddStep":ed.steps.push("");renderSheet();setTimeout(()=>{const x=document.querySelector(`[data-step="${ed.steps.length-1}"]`);if(x)x.focus();},30);break;
    case"edDelStep":ed.steps.splice(+t.dataset.i,1);renderSheet();break;
    case"edPrep":ed.prep=!ed.prep;if(ed.prep&&!ed.batch)ed.batch=ed.servings;renderSheet();break;
    case"edBatch":ed.batch=Math.max(1,(+ed.batch||ed.servings)+ +t.dataset.d);renderSheet();break;
    case"edKeeps":ed.keeps=ed.keeps===t.dataset.k?"":t.dataset.k;renderSheet();break;
    case"edAddPStep":ed.prepSteps.push("");renderSheet();setTimeout(()=>{const x=document.querySelector(`[data-pstep="${ed.prepSteps.length-1}"]`);if(x)x.focus();},30);break;
    case"edDelPStep":ed.prepSteps.splice(+t.dataset.i,1);renderSheet();break;
    case"edDraft":ed.draft=!ed.draft;renderSheet();break;
    case"edSave":t.disabled=true;await edSave();if(t.isConnected)t.disabled=false;break;
    /* pantry */
    case"pLow":pLow=!pLow;render();break;
    case"collapse":collapsed[t.dataset.k]=!collapsed[t.dataset.k];renderPantry();break;
    case"openItem":openItem=openItem===id?null:id;renderPantry();if(openItem){const x=$("#itemEditor");if(x)x.scrollIntoView({block:"nearest",behavior:"smooth"});}break;
    case"closeItem":openItem=null;renderPantry();break;
    case"step":stepItem(id,+t.dataset.d);break;
    case"setLevel":setItem(id,{level:t.dataset.v});break;
    case"toggleLow":{const it=S.items.find(x=>x.id===id);if(it)setItem(id,{level:it.level==="low"?"":"low"});break;}
    case"setTrack":{const it=S.items.find(x=>x.id===id);if(!it||it.track===t.dataset.v)break;
      if(t.dataset.v==="count"){const lv=levelOf(it),keep=it.unit&&isCount(it.unit)&&effQty(it)>0&&effQty(it)<50;setItem(id,{track:"count",qty:lv==="out"?0:keep?effQty(it):1,unit:it.unit&&isCount(it.unit)?it.unit:"pcs",level:lv==="low"?"low":""});}
      else setItem(id,{track:"status",level:levelOf(it)});break;}
    case"setUnit":setItem(id,{unit:t.dataset.u});break;
    case"newUnit":{const u=normUnit(askNew("package","bag, jar, tray"),"");if(!u)break;if(!unitList().includes(u))store.add("units",{name:u});setItem(id,{unit:u});break;}
    case"setItemStore":store.update("items",id,{store:t.dataset.s});break;
    case"newStore":{const s=askNew("store","No Frills or Bulk Barn");if(!s)break;if(!storeList().some(x=>x.toLowerCase()===s.toLowerCase())){if(storesServer)store.add("stores",{name:s});else S.stores.push({id:uid(),name:s});}
      if(t.dataset.for==="item")store.update("items",id,{store:s});else{store.update("list",id,{store:s});pickList=null;}break;}
    case"delItem":openItem=null;await store.del("items",id);toast("Item deleted");break;
    case"itemToList":{const it=S.items.find(x=>x.id===id);if(!it)break;await addToList(it.name,null,"",null);toast(`Added ${it.name} to your grocery list`);break;}
    case"quickAdd":openSheet({type:"add",dest:t.dataset.dest||"pantry",q:t.dataset.q||"",pick:null,qty:1,unit:"",level:"have",track:"count"});if(t.dataset.q){const q=norm(t.dataset.q);const hit=S.items.find(x=>norm(x.name).includes(q));sheet.pick=hit?hit.id:"__new";updateQA();}break;
    /* quick add */
    case"qaDest":sheet.dest=t.dataset.k;renderSheet();break;
    case"qaQuick":{const it=S.items.find(x=>x.id===id);if(!it)break;
      if(sheet.dest==="list"){await addToList(it.name,null,"",null);toast(`Added ${it.name} to your list`);}
      else if(isCounted(it)){const q=round2(effQty(it)+1);delete pendQ[it.id];setItem(it.id,{qty:q,level:""});toast(`${it.name}: now ${qtyText(q,it.unit)}`);}
      else{setItem(it.id,{level:"have"});toast(`${it.name}: Have`);}
      renderSheet();break;}
    case"qaClear":sheet.q="";qaReset(sheet);renderSheet(true);break;
    case"qaPick":{if(sheet.pick!==id){sheet.pick=id;sheet.qty=1;const it=S.items.find(x=>x.id===id);sheet.unit=it&&isCounted(it)?it.unit:"";sheet.level=it&&!isCounted(it)?(levelOf(it)==="have"?"have":"have"):"have";}updateQA();break;}
    case"qaTrack":sheet.track=t.dataset.k;updateQA();break;
    case"qaStep":sheet.qty=Math.max(1,sheet.qty+ +t.dataset.d);updateQA();break;
    case"qaUnit":sheet.unit=t.dataset.u;updateQA();break;
    case"qaLevel":sheet.level=t.dataset.k;updateQA();break;
    case"qaGo":t.disabled=true;await qaGo(t.dataset.next==="1");break;
    /* grocery list */
    case"fabAdd":sparkle(t);setTimeout(()=>openSheet({type:"add",dest:"list",q:"",pick:null,qty:1,unit:"",level:"have",track:"count"}),380);break;
    case"listMode":listMode=t.dataset.k;save("pc.lmode",listMode);renderList();break;
    case"storeFilter":storeFilter=t.dataset.k;save("pc.store",storeFilter);renderList();break;
    case"pickStore":pickList=pickList===id?null:id;renderList();break;
    case"setStore":{const l=S.list.find(x=>x.id===id);if(!l)break;store.update("list",id,{store:t.dataset.s});const it=findItem(l.name);if(it&&!it.store&&t.dataset.s)store.update("items",it.id,{store:t.dataset.s});pickList=null;break;}
    case"setListUnit":store.update("list",id,{unit:t.dataset.u});break;
    case"lStep":{const l=S.list.find(x=>x.id===id);if(!l)break;
      if(l.qty==null){const it=findItem(l.name);store.update("list",id,{qty:1,unit:it&&isCounted(it)?it.unit:"pcs"});break;}
      const q=round2(l.qty+ +t.dataset.d);store.update("list",id,q<=0?{qty:null,unit:""}:{qty:q});break;}
    case"toggleList":{const l=S.list.find(x=>x.id===id);if(!l)break;if(pickList===id)pickList=null;await store.update("list",id,{checked:!l.checked});break;}
    case"delList":pickList=null;await store.del("list",id);toast("Removed from the list");break;
    case"uncheckAll":for(const l of S.list.filter(x=>x.checked))await store.update("list",l.id,{checked:false});break;
    case"putAway":t.disabled=true;await putAway();break;
    case"suggestAdd":{const it=S.items.find(x=>x.id===id);if(it){await addToList(it.name,null,"",null);toast(`Added ${it.name}`);}break;}
    case"copyList":{const txt=listText();try{await navigator.clipboard.writeText(txt);toast("List copied. Paste it into a message.");}catch(err){openSheet({type:"text",text:txt});setTimeout(()=>{const o=$("#txtOut");if(o){o.focus();o.select();}},50);}break;}
    case"clearExamples":t.disabled=true;await clearExamples();break;
    /* barcode */
    case"scan":scanDest=t.dataset.dest||scanDest;openSheet({type:"scan"});break;
    case"torch":toggleTorch();break;
    case"pk":{if(!sheet||sheet.type!=="scanResult")break;sheet.pk=Math.max(1,(sheet.pk||1)+ +t.dataset.d);const el=$("#sPk");if(el)el.textContent=sheet.pk;scanUnitsUI();break;}
    case"scanUnit":sheet.unit=t.dataset.u;scanUnitsUI();break;
    case"useName":{const i=$("#sName");if(i){i.value=t.dataset.name;updateScanMatch();}break;}
  }
});
document.addEventListener("submit",async e=>{
  const id=e.target.id;
  if(id==="keyForm"){e.preventDefault();const k=$("#keyInput").value.trim();if(!k)return;setKey(k);auth="ok";ready=false;render();flush();return;}
  if(id==="codeForm"){e.preventDefault();const c=$("#codeInput").value.replace(/\D/g,"");if(c.length<6){toast("Enter the digits under the barcode.");return;}onScanned(c);return;}
  if(id==="scanForm"){e.preventDefault();const b=e.submitter;if(b)b.disabled=true;await submitScan(b&&b.dataset.to||scanDest);if(b&&b.isConnected)b.disabled=false;return;}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="rSearch"){searchQ=t.value;renderRecipes();return;}
  if(t.id==="pantryInput"){pFilter=t.value;renderPantry();return;}
  if(t.id==="qaInput"&&sheet&&sheet.type==="add"){sheet.q=t.value;const q=norm(t.value);if(!q){qaReset(sheet);}else{const hit=S.items.find(x=>norm(x.name)===q)||S.items.find(x=>norm(x.name).includes(q));const want=hit?hit.id:"__new";if(sheet.pick!==want){sheet.pick=want;sheet.qty=1;sheet.unit=hit&&isCounted(hit)?hit.unit:"";sheet.level="have";}}updateQA();return;}
  if(sheet&&sheet.type==="editRecipe"){
    const ed=sheet.ed,d=t.dataset;
    if(d.f){ed[d.f]=t.value;return;}
    if(d.ing!=null){const g=ed.ings[+d.ing];if(!g)return;if(d.k==="name"){g.name=t.value;const info=document.querySelector(`[data-info="${d.ing}"]`);if(info){const it=t.value.trim()?findItem(t.value):null;info.textContent=t.value.trim()?it?"✓ In your pantry":"Not in your pantry yet":"";info.classList.toggle("miss",!it);}}else{const v=t.value.trim();if(!v){g.qty=null;}else{const p=parseLine(v+" x");g.qty=p&&p.qty!=null?p.qty:null;if(g.qty!=null&&!g.unit)g.unit="pcs";}}return;}
    if(d.step!=null){ed.steps[+d.step]=t.value;return;}
    if(d.pstep!=null){ed.prepSteps[+d.pstep]=t.value;return;}
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="eName"){const v=cap(t.value.trim());if(v)store.update("items",t.dataset.id,{name:v});return;}
  if(t.id==="eCat"){store.update("items",t.dataset.id,{category:t.value});return;}
  if(t.id==="photoInput"){
    const f=t.files&&t.files[0];const target=photoFor;photoFor=null;if(!f||!target)return;
    let ph;try{ph=await shrinkPhoto(f);}catch(err){toast("That photo couldn't be opened. Try another.");return;}
    if(!target.id){if(sheet&&sheet.type==="editRecipe"){sheet.ed.photoPending=ph;renderSheet();toast("Photo added. It saves with the recipe.");}return;}
    const r=S.recipes.find(x=>x.id===target.id);if(!r)return;sendPhoto(r,ph);if(sheet)renderSheet();
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheet){closeSheet();return;}
  if(e.key!=="Enter")return;
  const t=e.target;
  if(t.id==="edAdd"){e.preventDefault();const p=parseLine(t.value);if(!p)return;sheet.ed.ings.push({name:p.name,qty:p.qty,unit:p.qty!=null?p.unit:"",note:p.note});renderSheet();setTimeout(()=>{const i=$("#edAdd");if(i)i.focus();},20);return;}
  if(t.id==="qaInput"){e.preventDefault();if(sheet&&sheet.pick)qaGo(false);return;}
  if(t.id==="rSearch"){e.preventDefault();t.blur();}
});

/* ---------- phone back button ----------
   Back closes an open panel, then goes to Recipes, then asks once more before leaving.
   A spare history entry catches the back press; it's added on a tap so Chrome won't skip it. */
let backArmed=false,exitAsk=0;
function armBack(){if(backArmed)return;try{history.pushState({pp:1},"");backArmed=true;}catch(e){}}
document.addEventListener("pointerdown",armBack,true);
window.addEventListener("popstate",()=>{
  backArmed=false;
  if(sheet){closeSheet();armBack();return;}
  if(tab!=="recipes"){setTab("recipes");armBack();return;}
  // Nothing left to go back to: warn once, and leave the next back press to Android for 2.5 s
  exitAsk=Date.now();toast("Press back again to close Pantry Pal");
  setTimeout(()=>{if(Date.now()-exitAsk>=2400)armBack();},2500);
});

boot();
})();
</script>
